name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22.13.1
  PNPM_VERSION: 11.7.0
  KUBECTL_VERSION: v1.34.0

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test -p=1 -count=1 ./...
      - name: Build server
        working-directory: backend
        run: go build -trimpath -ldflags "-s -w -X k8s-aiops.local/backend/internal/buildinfo.Version=${GITHUB_SHA}" -o /tmp/aiops-api ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test -- --run
      - name: Build
        working-directory: frontend
        run: pnpm build

  manifests:
    name: Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified kubectl
        run: |
          mkdir -p .tools-ci
          curl --fail --silent --show-error --location --output .tools-ci/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --output .tools-ci/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat .tools-ci/kubectl.sha256)" .tools-ci/kubectl | sha256sum --check
          chmod +x .tools-ci/kubectl
      - name: Render fixed Kustomize roots
        run: |
          for directory in deploy/kubernetes deploy/managed-cluster deploy/demo-scenarios deploy/diagnosis-e2e; do
            .tools-ci/kubectl kustomize "$directory" >/dev/null
          done
      - name: Validate Compose model
        run: docker compose config --quiet

  runtime:
    name: Compose runtime
    needs: [backend, frontend, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral runtime configuration
        shell: bash
        run: |
          umask 077
          printf '%s\n' \
            'APP_ENV=production' \
            'POSTGRES_DB=aiops_ci' \
            'POSTGRES_USER=aiops_ci' \
            "POSTGRES_PASSWORD=$(openssl rand -hex 24)" \
            "JWT_SIGNING_KEY=$(openssl rand -hex 32)" \
            "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)" \
            "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" \
            'CREDENTIAL_KEY_VERSION=v1' \
            'AI_ENABLED=false' \
            'NOTIFICATION_ENABLED=false' >.env
      - name: Build and start Compose runtime
        run: docker compose up -d --build
      - name: Wait for healthy services
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            ready=true
            for service in postgres backend frontend; do
              container_id="$(docker compose ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              if [ "$state" != healthy ]; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Check backend, frontend and proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready | grep '"status":"ready"'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health/ready | grep '"status":"ready"'
      - name: Collect sanitized runtime logs
        if: always()
        run: |
          mkdir -p .artifacts/ci
          docker compose ps >.artifacts/ci/compose-ps.txt 2>&1 || true
          docker compose logs --no-color >.artifacts/ci/compose.log 2>&1 || true
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-runtime-${{ github.run_id }}
          path: .artifacts/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral runtime
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env

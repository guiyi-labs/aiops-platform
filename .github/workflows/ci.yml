name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_runtime:
        description: Run all runtime quality gates even for documentation-only diffs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22.13.1
  PNPM_VERSION: 11.7.0
  KUBECTL_VERSION: v1.34.0
  HELM_VERSION: v3.16.3
  CI_BACKEND_IMAGE: aiops-ci-backend:${{ github.sha }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_RUNTIME: ${{ inputs.force_runtime }}
        run: |
          runtime_required=true
          if [ "$FORCE_RUNTIME" != true ] && { [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = pull_request ]; }; then
            base="$BEFORE_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              base="$PR_BASE_SHA"
            fi
            if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(docs/|README\.md$|CHANGELOG\.md$)' >/dev/null; then
              runtime_required=false
            fi
          fi
          printf 'runtime_required=%s\n' "$runtime_required" >>"$GITHUB_OUTPUT"

  change-record:
    name: Change-record archive gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce docs/changes/ record for non-doc changes (AGENTS.md §1)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$EVENT_NAME" = push ]; then
            base="$BEFORE_SHA"
          elif [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          ./scripts/check-change-record.sh --base "$base"

  sensitive-scan:
    name: Sensitive-field scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for secret material
        shell: bash
        run: |
          ./scripts/scan-sensitive-fields.sh

  dependency-scan:
    name: Dependency & supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependency vulnerability scan (Go + frontend prod)
        run: ./scripts/dependency-vuln-scan.sh
      - name: License allowlist scan
        run: |
          (cd backend && go mod download)
          ./scripts/license-scan.sh
      - name: Image base layer drift gate
        run: ./scripts/image-base-drift.sh
      - name: SBOM diff self-test
        run: |
          set -e
          # baseline vs current must fail closed: diff on stdout + gate line on stderr,
          # so capture both with 2>&1 before asserting.
          out="$({ node scripts/sbom-diff.mjs scripts/testdata/sbom/baseline.spdx.json scripts/testdata/sbom/current.spdx.json || true; } 2>&1)"
          printf '%s\n' "$out" | grep -q 'quic-go/quic-go@v0.59.1'
          printf '%s\n' "$out" | grep -q 'fail-closed'
          node scripts/sbom-diff.mjs scripts/testdata/sbom/baseline.spdx.json scripts/testdata/sbom/baseline.spdx.json

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build shared backend image
        run: |
          docker build --tag "$CI_BACKEND_IMAGE" --build-arg "VERSION=$GITHUB_SHA" backend
          mkdir -p .artifacts/ci-backend-image
          docker image save --output .artifacts/ci-backend-image/backend-image.tar "$CI_BACKEND_IMAGE"
      - name: Upload shared backend image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image/backend-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: golangci-lint
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --config ../.golangci.yml ./...
      - name: Test and coverage baseline
        working-directory: backend
        run: |
          go test -cover -p=1 -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1 | awk '{split($NF, a, "%"); if (a[1]+0 < 70.0) { print "Coverage " a[1] "% is below 70.0% baseline"; exit 1 } else { print "Coverage " a[1] "% meets 70.0% baseline" }}'
      # P2a: core package gate raised to 75% (global stays 70%). The list covers
      # the flagship diagnosis store (metricshistory), the query/validation
      # building blocks (apiquery), the legacy API surface (deprecatedapi),
      # the cost/optimization engine and the P1 RAG knowledge base.
      - name: Core package coverage gate (P2a)
        working-directory: backend
        run: |
          for pkg in ./internal/metricshistory/ ./internal/apiquery/ ./internal/deprecatedapi/ ./internal/optimization/ ./internal/knowledge/; do
            cover="$(go test -cover -p=1 -count=1 "$pkg" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')"
            if awk -v c="$cover" 'BEGIN{ exit !(c < 75.0) }'; then
              printf 'Core package %s coverage %s%% is below 75.0%%\n' "$pkg" "$cover"
              exit 1
            fi
            printf 'Core package %s coverage %s%% meets 75.0%%\n' "$pkg" "$cover"
          done
      - name: Fuzz seed + benchmark smoke (M84)
        working-directory: backend
        run: |
          go test -run '^Fuzz' -count=1 ./internal/metricshistory/ ./internal/deprecatedapi/ ./internal/apiquery/ ./internal/netpolicy/ ./internal/namespaceposture/ ./internal/optimization/ ./internal/kubernetes/ ./internal/posture/ ./internal/topology/ ./internal/incident/ ./internal/correlation/ ./internal/automation/
          go test -bench . -benchtime 5x -run '^$' ./internal/metricshistory/ ./internal/topology/ ./internal/posture/ ./internal/capability/
      - name: Generate and verify M96 scale fixture (report mode)
        working-directory: backend
        run: |
          mkdir -p .artifacts/scale-fixture
          go run ./cmd/scale-fixture -config testdata/scale/m96-v1.json -output .artifacts/scale-fixture/m96-v1 > .artifacts/scale-fixture/m96-generation.json
          go run ./cmd/scale-fixture -verify .artifacts/scale-fixture/m96-v1 > .artifacts/scale-fixture/m96-verification.json
      - name: Run M96 backend scale benchmark (report mode)
        working-directory: backend
        run: |
          go run ./cmd/scale-bench -config testdata/scale/m96-v1.json -fixture .artifacts/scale-fixture/m96-v1 -output .artifacts/scale-bench/m96-backend-baseline-v1.json -commit "${GITHUB_SHA}"
      - name: Upload M96 scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-evidence-${{ github.run_id }}
          path: |
            backend/.artifacts/scale-fixture/m96-v1/manifest.json
            backend/.artifacts/scale-fixture/m96-generation.json
            backend/.artifacts/scale-fixture/m96-verification.json
            backend/.artifacts/scale-bench/m96-backend-baseline-v1.json
            backend/.artifacts/scale-bench/m96-backend-baseline-v1.md
          if-no-files-found: warn
          retention-days: 7
      - name: Build server
        working-directory: backend
        run: |
          go build -trimpath -ldflags "-s -w -X k8s-aiops.local/backend/internal/buildinfo.Version=${GITHUB_SHA}" -o /tmp/aiops-api ./cmd/server
          go build -trimpath -ldflags "-s -w" -o /tmp/credential-reencrypt ./cmd/credential-reencrypt
          go build -trimpath -ldflags "-s -w -X k8s-aiops.local/backend/internal/buildinfo.Version=${GITHUB_SHA}" -o /tmp/audit-archive ./cmd/audit-archive
          go build -trimpath -ldflags "-s -w" -o /tmp/identity-readiness ./cmd/identity-readiness
          go build -trimpath -ldflags "-s -w" -o /tmp/recovery-readiness ./cmd/recovery-readiness
          go build -trimpath -ldflags "-s -w" -o /tmp/scale-fixture ./cmd/scale-fixture
          go build -trimpath -ldflags "-s -w" -o /tmp/scale-bench ./cmd/scale-bench
      - name: Verify clean working tree
        run: git diff --exit-code
      - name: OpenAPI breaking-change check
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          go install github.com/oasdiff/oasdiff@v1.27.0
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > /tmp/openapi-base.yaml
          "$(go env GOPATH)/bin/oasdiff" breaking /tmp/openapi-base.yaml ../docs/api/openapi.yaml --fail-on ERR

  race:
    name: Backend race
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Race detector
        working-directory: backend
        run: go test -race -p=2 -count=1 ./...

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Contract typegen sync (W10)
        working-directory: frontend
        run: |
          pnpm typegen
          git diff --exit-code -- src/api/openapi.d.ts
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test -- --run
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Active CSS layer audit (M96, report mode)
        working-directory: frontend
        run: pnpm style:audit
      - name: Bundle size gate (W11)
        working-directory: frontend
        run: pnpm bundle:gate
      - name: Install Playwright browser (M93-B2 perf probe)
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser regression (M96 shell)
        working-directory: frontend
        run: pnpm test:e2e
      - name: Login performance probe (M93-B2, report mode)
        working-directory: frontend
        run: pnpm perf:login
      - name: Pod scale performance probe (M96, report mode)
        working-directory: frontend
        run: pnpm perf:pods
      - name: Upload login perf artifact (M93-B2)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: login-perf-${{ github.run_id }}
          path: |
            frontend/.artifacts/login-perf/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Pod scale perf artifact (M96)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pod-scale-perf-${{ github.run_id }}
          path: |
            frontend/.artifacts/pod-scale-perf/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload active CSS audit artifact (M96)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: style-audit-${{ github.run_id }}
          path: |
            frontend/.artifacts/style-audit/
          if-no-files-found: warn
          retention-days: 7

  gate-b:
    name: M96 Gate B
    needs: [changes, backend, frontend]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # M109: two stable CI cycles recorded in docs/m96-gate-b-baselines.md;
      # Gate B is now fail-closed. Regressions block CI (see m96-gate-b.mjs).
      GATE_B_MODE: fail-closed
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download M96 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-${{ github.run_id }}'
          path: .artifacts/m96-gate-b/input
          merge-multiple: true
      - name: Aggregate M96 Gate B evidence
        run: node scripts/m96-gate-b.mjs --root .artifacts/m96-gate-b/input --output .artifacts/m96-gate-b/m96-gate-b.json --expected-commit "${GITHUB_SHA}"
      - name: Upload M96 Gate B report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m96-gate-b-${{ github.run_id }}
          path: .artifacts/m96-gate-b/
          if-no-files-found: error
          retention-days: 14

  manifests:
    name: Manifests
    needs: changes
    if: needs.changes.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified kubectl
        run: |
          mkdir -p .tools-ci
          curl --fail --silent --show-error --location --output .tools-ci/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --output .tools-ci/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat .tools-ci/kubectl.sha256)" .tools-ci/kubectl | sha256sum --check
          chmod +x .tools-ci/kubectl
      - name: Install checksum-verified helm
        run: |
          mkdir -p .tools-ci
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output ".tools-ci/${archive}" "https://get.helm.sh/${archive}"
          curl --fail --silent --show-error --location --output ".tools-ci/${archive}.sha256" "https://get.helm.sh/${archive}.sha256"
          printf '%s  %s\n' "$(cat ".tools-ci/${archive}.sha256")" ".tools-ci/${archive}" | sha256sum --check
          tar -xzf ".tools-ci/${archive}" -C .tools-ci
          mv .tools-ci/linux-amd64/helm .tools-ci/helm
          chmod +x .tools-ci/helm
      - name: Render fixed Kustomize roots
        run: |
          for directory in deploy/kubernetes deploy/managed-cluster deploy/demo-scenarios deploy/diagnosis-e2e; do
            .tools-ci/kubectl kustomize "$directory" >/dev/null
          done
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Helm lint --strict on aiops-platform chart
        run: .tools-ci/helm lint --strict deploy/helm/aiops-platform

  credential-drill:
    name: Credential drill
    needs: [changes, backend-image]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shared backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image
      - name: Load shared backend image
        run: docker image load --input .artifacts/ci-backend-image/backend-image.tar
      - name: Drill isolated credential key re-encryption
        shell: pwsh
        run: ./scripts/e2e-credential-reencryption.ps1 -BackendImage $env:CI_BACKEND_IMAGE
      - name: Upload credential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-reencryption-${{ github.run_id }}
          path: .artifacts/credential-reencryption/
          if-no-files-found: error
          retention-days: 7

  audit-drill:
    name: Audit archive drill
    needs: [changes, backend-image]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shared backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image
      - name: Load shared backend image
        run: docker image load --input .artifacts/ci-backend-image/backend-image.tar
      - name: Drill signed audit archive
        shell: pwsh
        run: ./scripts/e2e-audit-archive.ps1 -BackendImage $env:CI_BACKEND_IMAGE
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-archive-${{ github.run_id }}
          path: .artifacts/audit-archive/
          if-no-files-found: error
          retention-days: 7

  identity-drill:
    name: Identity readiness drill
    needs: [changes, backend-image]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shared backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image
      - name: Load shared backend image
        run: docker image load --input .artifacts/ci-backend-image/backend-image.tar
      - name: Evaluate synthetic OIDC and MFA readiness
        shell: pwsh
        run: ./scripts/e2e-identity-readiness.ps1 -BackendImage $env:CI_BACKEND_IMAGE
      - name: Upload identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-readiness-${{ github.run_id }}
          path: .artifacts/identity-readiness/
          if-no-files-found: error
          retention-days: 7

  recovery-drill:
    name: Recovery readiness drill
    needs: [changes, backend-image]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shared backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image
      - name: Load shared backend image
        run: docker image load --input .artifacts/ci-backend-image/backend-image.tar
      - name: Drill isolated PostgreSQL backup and restore
        shell: pwsh
        run: ./scripts/e2e-postgres-backup-restore.ps1
      - name: Evaluate recovery policy readiness
        shell: pwsh
        run: ./scripts/e2e-recovery-readiness.ps1 -BackendImage $env:CI_BACKEND_IMAGE
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-readiness-${{ github.run_id }}
          path: |
            .artifacts/postgres-recovery/
            .artifacts/recovery-readiness/
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Compose runtime
    needs: [changes, backend-image, backend, frontend, manifests]
    if: ${{ always() && needs.changes.outputs.runtime_required == 'true' && needs.backend-image.result == 'success' && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.manifests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download shared backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-backend-image-${{ github.run_id }}
          path: .artifacts/ci-backend-image
      - name: Load shared backend image
        run: docker image load --input .artifacts/ci-backend-image/backend-image.tar
      - name: Generate ephemeral runtime configuration
        shell: bash
        run: |
          umask 077
          printf '%s\n' \
            'APP_ENV=production' \
            'POSTGRES_DB=aiops_ci' \
            'POSTGRES_USER=aiops_ci' \
            "POSTGRES_PASSWORD=$(openssl rand -hex 24)" \
            "JWT_SIGNING_KEY=$(openssl rand -hex 32)" \
            "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)" \
            "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" \
            'CREDENTIAL_KEY_VERSION=v1' \
            'CREDENTIAL_DECRYPTION_KEYS={}' \
            'AI_ENABLED=false' \
            'NOTIFICATION_ENABLED=false' >.env
      - name: Build frontend and start Compose runtime from shared backend
        run: |
          docker image tag "$CI_BACKEND_IMAGE" k8s-aiops-backend
          docker compose build frontend
          docker compose up -d --no-build
      - name: Wait for healthy services
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            ready=true
            for service in postgres backend frontend; do
              container_id="$(docker compose ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              if [ "$state" != healthy ]; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify authenticated metrics history isolation and restart durability
        shell: pwsh
        run: ./scripts/e2e-metrics-history.ps1
      - name: Check backend, frontend and proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready | grep '"status":"ready"'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health/ready | grep '"status":"ready"'
      - name: Collect sanitized runtime logs
        if: always()
        run: |
          mkdir -p .artifacts/ci
          docker compose ps >.artifacts/ci/compose-ps.txt 2>&1 || true
          docker compose logs --no-color >.artifacts/ci/compose.log 2>&1 || true
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-runtime-${{ github.run_id }}
          path: |
            .artifacts/ci/
            .artifacts/metrics-history-e2e/
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral runtime
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env

  result:
    name: CI result
    if: always()
    needs: [changes, change-record, backend-image, backend, race, frontend, gate-b, manifests, credential-drill, audit-drill, identity-drill, recovery-drill, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime_required }}
      CHANGE_SCOPE_RESULT: ${{ needs.changes.result }}
      CHANGE_RECORD_RESULT: ${{ needs.change-record.result }}
      BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      RACE_RESULT: ${{ needs.race.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      GATE_B_RESULT: ${{ needs.gate-b.result }}
      MANIFESTS_RESULT: ${{ needs.manifests.result }}
      CREDENTIAL_RESULT: ${{ needs.credential-drill.result }}
      AUDIT_RESULT: ${{ needs.audit-drill.result }}
      IDENTITY_RESULT: ${{ needs.identity-drill.result }}
      RECOVERY_RESULT: ${{ needs.recovery-drill.result }}
      RUNTIME_RESULT: ${{ needs.runtime.result }}
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          if [ "$CHANGE_SCOPE_RESULT" != success ]; then
            exit 1
          fi
          if [ "$CHANGE_RECORD_RESULT" != success ]; then
            exit 1
          fi
          case "$RUNTIME_REQUIRED" in
            true)
              for result in "$BACKEND_IMAGE_RESULT" "$BACKEND_RESULT" "$RACE_RESULT" "$FRONTEND_RESULT" "$GATE_B_RESULT" "$MANIFESTS_RESULT" "$CREDENTIAL_RESULT" "$AUDIT_RESULT" "$IDENTITY_RESULT" "$RECOVERY_RESULT" "$RUNTIME_RESULT"; do
                if [ "$result" != success ]; then
                  exit 1
                fi
              done
              ;;
            false)
              for result in "$BACKEND_IMAGE_RESULT" "$BACKEND_RESULT" "$RACE_RESULT" "$FRONTEND_RESULT" "$GATE_B_RESULT" "$MANIFESTS_RESULT" "$CREDENTIAL_RESULT" "$AUDIT_RESULT" "$IDENTITY_RESULT" "$RECOVERY_RESULT" "$RUNTIME_RESULT"; do
                if [ "$result" != skipped ]; then
                  exit 1
                fi
              done
              ;;
            *)
              exit 1
              ;;
          esac

name: Release

on:
  push:
    tags:
      - 'v*.*.*-rc.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic RC version used for a package-only rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate RC version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve semantic RC version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            printf 'Invalid release candidate version: %s\n' "$version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  quality:
    name: Required quality gate
    uses: ./.github/workflows/ci.yml
    with:
      force_runtime: true

  package:
    name: Build and verify RC package
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    outputs:
      signed_digest: ${{ steps.signed_root.outputs.digest }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build multi-architecture OCI archives
        shell: bash
        run: |
          mkdir -p .artifacts/release
          image_version="${VERSION#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$image_version" \
            --tag "k8s-aiops-backend:$VERSION" \
            --output "type=oci,dest=.artifacts/release/aiops-platform-backend-$VERSION-linux-multiarch-oci.tar" \
            backend
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "k8s-aiops-frontend:$VERSION" \
            --output "type=oci,dest=.artifacts/release/aiops-platform-frontend-$VERSION-linux-multiarch-oci.tar" \
            frontend
      - name: Install SBOM tooling
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.27.0
          syft version
      - name: Generate image SBOMs
        shell: bash
        run: |
          mkdir -p .artifacts/sbom-inputs
          image_version="${VERSION#v}"
          for platform in linux/amd64 linux/arm64; do
            platform_slug="${platform//\//-}"
            backend_input=".artifacts/sbom-inputs/backend-$platform_slug-oci.tar"
            frontend_input=".artifacts/sbom-inputs/frontend-$platform_slug-oci.tar"
            docker buildx build \
              --platform "$platform" \
              --build-arg "VERSION=$image_version" \
              --tag "k8s-aiops-backend:$VERSION" \
              --output "type=oci,dest=$backend_input" \
              backend
            docker buildx build \
              --platform "$platform" \
              --tag "k8s-aiops-frontend:$VERSION" \
              --output "type=oci,dest=$frontend_input" \
              frontend
            syft "oci-archive:$backend_input" \
              --source-name k8s-aiops-backend --source-version "$VERSION" \
              --output "spdx-json=.artifacts/release/sbom-backend-$VERSION-$platform_slug-spdx.json"
            syft "oci-archive:$frontend_input" \
              --source-name k8s-aiops-frontend --source-version "$VERSION" \
              --output "spdx-json=.artifacts/release/sbom-frontend-$VERSION-$platform_slug-spdx.json"
          done
      - name: Validate and package deployment assets
        shell: bash
        run: |
          helm version --short
          helm lint --strict deploy/helm/aiops-platform
          helm package deploy/helm/aiops-platform \
            --version "${VERSION#v}" --app-version "${VERSION#v}" \
            --destination .artifacts/release
          kubectl kustomize deploy/kubernetes >/dev/null
          tar -czf ".artifacts/release/aiops-platform-kustomize-$VERSION.tar.gz" \
            -C deploy kubernetes
      - name: Assemble source and offline assets
        shell: bash
        run: |
          git archive --format=tar.gz \
            --output=".artifacts/release/aiops-platform-source-$VERSION.tar.gz" \
            "$GITHUB_SHA"
          cp docs/api/openapi.yaml .artifacts/release/openapi.yaml
          cp docs/thesis/dependency-licenses.md .artifacts/release/dependency-licenses.md
          cp docs/security/license-allowlist.json .artifacts/release/license-allowlist.json
          cp docs/release-candidate-operations.md .artifacts/release/release-candidate-operations.md
          offline_name="aiops-platform-offline-$VERSION"
          offline_root=".artifacts/offline/$offline_name"
          mkdir -p "$offline_root"/{images,deploy,config,docs,sbom}
          cp .artifacts/release/*-oci.tar "$offline_root/images/"
          cp .artifacts/release/sbom-*.json "$offline_root/sbom/"
          cp .artifacts/release/aiops-platform-*.tgz "$offline_root/deploy/"
          cp ".artifacts/release/aiops-platform-kustomize-$VERSION.tar.gz" "$offline_root/deploy/"
          cp deploy/kubernetes/secret.example.yaml "$offline_root/config/secret.example.yaml"
          cp docs/release-candidate-operations.md "$offline_root/docs/release-candidate-operations.md"
          (
            cd "$offline_root"
            find . -type f ! -name OFFLINE-SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum >OFFLINE-SHA256SUMS
          )
          tar -czf ".artifacts/release/$offline_name.tar.gz" -C .artifacts/offline "$offline_name"
      - name: Generate provenance and release manifest
        shell: bash
        run: |
          node scripts/release-manifest.mjs provenance \
            --directory .artifacts/release \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --builder-id "https://github.com/$GITHUB_WORKFLOW_REF" \
            --invocation-id "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          node scripts/release-manifest.mjs create \
            --directory .artifacts/release \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --signature-mode keyless \
            --strict
          node scripts/release-manifest.mjs verify \
            --directory .artifacts/release \
            --strict
      - name: Install Cosign release tooling
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382 # v3.7.0
        with:
          cosign-release: v2.4.1
      - name: Sign and verify immutable checksum root
        id: signed_root
        shell: bash
        working-directory: .artifacts/release
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign-blob --yes \
            --bundle SHA256SUMS.bundle \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.cert.pem \
            SHA256SUMS
          cosign verify-blob \
            --bundle SHA256SUMS.bundle \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          digest=$(sha256sum SHA256SUMS | awk '{print $1}')
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Enforce complete signed RC
        shell: bash
        run: |
          node scripts/release-manifest.mjs verify \
            --directory .artifacts/release \
            --strict \
            --require-signatures
      - name: Upload signed RC artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiops-platform-${{ env.VERSION }}
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" .artifacts/release/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "AIOps Platform $VERSION"

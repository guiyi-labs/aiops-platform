apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m18-pending-pvc
  namespace: aiops-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: m18-storage-class-does-not-exist
  resources:
    requests:
      storage: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m18-broken-ingress
  namespace: aiops-demo
spec:
  rules:
    - host: m18-broken.aiops.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-without-endpoints
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: m18-saturated-hpa
  namespace: aiops-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-without-endpoints
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 1

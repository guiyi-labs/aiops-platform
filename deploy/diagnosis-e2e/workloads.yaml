apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalled-deployment
  namespace: aiops-diagnosis-e2e
  labels:
    app.kubernetes.io/name: stalled-deployment
    app.kubernetes.io/part-of: aiops-diagnosis-e2e
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stalled-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalled-deployment
    spec:
      nodeSelector:
        aiops.local/diagnosis-target: never
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlled-operation-operator
  namespace: {{ include "aiops-platform.namespace" . }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlled-operation-operator
  labels:
    {{- include "aiops-platform.labels" (dict "name" "controlled-operation-operator" "root" .) | nindent 4 }}
rules:
  - apiGroups: ["aiops.platform"]
    resources: ["controlledoperations", "controlledoperations/status", "controlledoperations/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlled-operation-operator
  labels:
    {{- include "aiops-platform.labels" (dict "name" "controlled-operation-operator" "root" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlled-operation-operator
subjects:
  - kind: ServiceAccount
    name: controlled-operation-operator
    namespace: {{ include "aiops-platform.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlled-operation-operator
  namespace: {{ include "aiops-platform.namespace" . }}
  labels:
    {{- include "aiops-platform.labels" (dict "name" "controlled-operation-operator" "root" .) | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlled-operation-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlled-operation-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: controlled-operation-operator
      {{- with .Values.operator.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --workers={{ .Values.operator.workers }}
          {{- with .Values.operator.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.operator.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
# Default values for aiops-platform.
# Secrets are NOT generated by this chart. Provide them externally via an
# existing Secret named aiops-secrets (see secret.example.yaml for the schema).

namespace:
  create: true
  name: aiops-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

backend:
  image:
    repository: k8s-aiops-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  config:
    APP_ENV: production
    HTTP_ADDR: ":8080"
    SHUTDOWN_TIMEOUT: 10s
    ACCESS_TOKEN_TTL: 15m
    REFRESH_TOKEN_TTL: 168h
    BOOTSTRAP_ADMIN_USERNAME: admin
    CREDENTIAL_KEY_VERSION: v1
    CLUSTER_PROBE_TIMEOUT: 10s
    METRICS_HISTORY_ENABLED: "true"
    METRICS_HISTORY_RETENTION: 168h
    METRICS_COLLECTION_INTERVAL: 1m
    METRICS_COLLECTION_TIMEOUT: 10s
    METRICS_CLEANUP_INTERVAL: 1h
    METRICS_MAX_CLUSTERS: "20"
    METRICS_MAX_CONCURRENCY: "4"
    AI_ENABLED: "false"
    AI_BASE_URL: https://api.openai.com/v1
    AI_MODEL: gpt-5.4-mini
    AI_REQUEST_TIMEOUT: 30s
    AI_DAILY_TOKEN_BUDGET: "100000"
    AI_MAX_CONCURRENT_REQUESTS: "2"
    AI_MAX_OUTPUT_TOKENS: "1200"
    NOTIFICATION_ENABLED: "false"
    NOTIFICATION_WEBHOOK_URL: ""
    NOTIFICATION_POLL_INTERVAL: 5s
    NOTIFICATION_REQUEST_TIMEOUT: 10s
    NOTIFICATION_RETRY_BASE: 10s
    NOTIFICATION_MAX_ATTEMPTS: "5"
    NOTIFICATION_BATCH_SIZE: "10"
    INCIDENT_SLA_MONITOR_ENABLED: "true"
    INCIDENT_SLA_POLL_INTERVAL: 30s
    INCIDENT_SLA_APPROACHING_WINDOW: 15m
    INCIDENT_SLA_FIRST_ESCALATION_AFTER: 30m
    INCIDENT_SLA_FINAL_ESCALATION_AFTER: 2h
    INCIDENT_SLA_BATCH_SIZE: "20"

frontend:
  image:
    repository: k8s-aiops-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  image:
    repository: pgvector/pgvector
    tag: 0.8.1-pg17
    pullPolicy: IfNotPresent
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: aiops.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: aiops-tls

networkPolicies:
  enabled: true

# Existing secret containing database, JWT, encryption and bootstrap credentials.
# Must contain: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, DATABASE_URL,
# JWT_SIGNING_KEY, BOOTSTRAP_ADMIN_PASSWORD, CREDENTIAL_ENCRYPTION_KEY,
# CREDENTIAL_DECRYPTION_KEYS, AI_API_KEY, NOTIFICATION_WEBHOOK_SECRET
existingSecret: aiops-secrets

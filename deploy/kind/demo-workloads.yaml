---
# A CrashLoopBackOff pod for diagnosis demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-service
  namespace: prod
  labels:
    app: broken-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-service
  template:
    metadata:
      labels:
        app: broken-service
    spec:
      containers:
      - name: broken
        image: busybox:1.36
        command: ["sh", "-c", "echo 'crash demo'; exit 1"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
# An OOMKilled pod for diagnosis demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: prod
  labels:
    app: memory-hog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
      - name: hog
        image: polinux/stress:1.0.4
        command: ["stress", "--vm", "1", "--vm-bytes", "256M", "--vm-hang", "1"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
# An Ingress for the api-gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: prod
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
---
# A CronJob for demo
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-cleanup
  namespace: staging
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: busybox:1.36
            command: ["sh", "-c", "echo 'cleanup job running'; sleep 5"]
          restartPolicy: OnFailure

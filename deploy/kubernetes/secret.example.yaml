# Copy this file outside Git, replace every CHANGE_ME value, then apply it with:
# kubectl apply -f /secure/path/aiops-secret.yaml
# DATABASE_URL must contain the same PostgreSQL password, URL-encoded when needed.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops-system
type: Opaque
stringData:
  POSTGRES_DB: aiops
  POSTGRES_USER: aiops
  POSTGRES_PASSWORD: CHANGE_ME_DATABASE_PASSWORD
  DATABASE_URL: postgres://aiops:CHANGE_ME_DATABASE_PASSWORD@postgres:5432/aiops?sslmode=disable
  JWT_SIGNING_KEY: CHANGE_ME_AT_LEAST_32_RANDOM_CHARACTERS
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME_INITIAL_ADMIN_PASSWORD
  CREDENTIAL_ENCRYPTION_KEY: CHANGE_ME_BASE64_ENCODED_32_BYTE_KEY
  CREDENTIAL_DECRYPTION_KEYS: '{}'
  AI_API_KEY: ""
  NOTIFICATION_WEBHOOK_SECRET: ""

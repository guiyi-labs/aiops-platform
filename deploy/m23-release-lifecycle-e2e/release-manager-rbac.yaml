apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-platform-release-manager
  namespace: aiops-m23-e2e
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-platform-release-manager
  namespace: aiops-m23-e2e
subjects:
  - kind: ServiceAccount
    name: aiops-platform
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-platform-release-manager

apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-target
  namespace: aiops-m23-e2e
  labels:
    app.kubernetes.io/name: release-target
    app.kubernetes.io/part-of: aiops-m23-release-lifecycle-e2e
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: release-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-target
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

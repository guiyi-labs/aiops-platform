apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-platform-promotion-manager
  namespace: aiops-m24-dest
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-platform-promotion-manager
  namespace: aiops-m24-dest
subjects:
  - kind: ServiceAccount
    name: aiops-platform
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-platform-promotion-manager

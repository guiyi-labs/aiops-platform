# Minimal Velero Backup CRD stub.
# Registers the velero.io/v1 API group and the backups resource so the
# platform's VeleroCapability probe (/apis/velero.io/v1) reports installed.
# No controller is deployed; sample Backup CRs are created directly to
# exercise the read-only inventory contract. A real Velero install is out of
# scope for an inventory-only milestone.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.velero.io
spec:
  group: velero.io
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
    listKind: BackupList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

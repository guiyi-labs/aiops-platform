apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-platform-deployment-remediator
  namespace: aiops-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-platform-deployment-remediator
  namespace: aiops-demo
subjects:
  - kind: ServiceAccount
    name: aiops-platform
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-platform-deployment-remediator

        mttr_seconds: { type: number, format: double, minimum: 0, nullable: true }
    IncidentResource: { type: object, properties: { kind: { type: string }, namespace: { type: string }, name: { type: string }, uid: { type: string } } }
    IncidentTransitionRequest: { type: object, required: [expected_version, status], properties: { expected_version: { type: integer, format: int64 }, status: { type: string, enum: [open, confirmed, resolved, dismissed] }, comment: { type: string, maxLength: 2000 } } }
    IncidentAssignmentRequest: { type: object, required: [expected_version, assignee_user_id], properties: { expected_version: { type: integer, format: int64 }, assignee_user_id: { type: integer, format: int64 }, comment: { type: string, maxLength: 2000 } } }
    IncidentFollowerRequest: { type: object, required: [user_id], properties: { user_id: { type: integer, format: int64 } } }
    IncidentNoteRequest: { type: object, required: [expected_version, content], properties: { expected_version: { type: integer, format: int64 }, content: { type: string, maxLength: 4000 } } }
    IncidentPostmortemRequest: { type: object, required: [expected_version], properties: { expected_version: { type: integer, format: int64 }, content: { type: string, maxLength: 10000 } } }
    IncidentEvidenceField: { type: object, required: [label], properties: { label: { type: string }, value: { type: string } } }
    IncidentBatchAssignRequest:
      type: object
      required: [incident_ids, assignee_user_id]
      properties:
        incident_ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer, format: int64 } }
        assignee_user_id: { type: integer, format: int64 }
        comment: { type: string, maxLength: 2000 }
    IncidentBatchAssignResult:
      type: object
      required: [total, assigned]
      properties:
        total: { type: integer, format: int64 }
        assigned: { type: integer, format: int64 }
        failed: { type: array, items: { $ref: '#/components/schemas/IncidentAssignFailure' } }
    IncidentAssignFailure:
      type: object
      required: [incident_id, error]
      properties:
        incident_id: { type: integer, format: int64 }
        error: { type: string }
    IncidentEvidenceItem: { type: object, required: [source_type, source_ref, title, deep_link], properties: { source_type: { type: string, enum: [diagnosis, finding, alert, inspection, signal, correlation] }, source_ref: { type: string }, title: { type: string }, summary: { type: string }, severity: { type: string, enum: [info, warning, high, critical] }, resource: { $ref: '#/components/schemas/IncidentResource' }, observed_at: { type: string, format: date-time }, deep_link: { type: string }, fields: { type: array, items: { $ref: '#/components/schemas/IncidentEvidenceField' } } } }
    IncidentRunbookResponse:
      type: object
      additionalProperties: false
      required: [incident_id, available]
      description: Read-only association status. Unavailable sources fail closed and never receive guessed domain metadata.
      properties:
        incident_id: { type: integer, format: int64 }
        available: { type: boolean }
        reason: { type: string, enum: [source_resolver_unavailable, source_unavailable, domain_unavailable] }
        domain: { type: string }
        finding_code: { type: string }
        runbook: { $ref: '#/components/schemas/InsightRunbook' }
    IncidentContextCockpit:
      type: object
      additionalProperties: false
      description: M112-1 aggregated incident context cockpit. Deterministic read derived from the incident snapshot, evidence resolver and insight runbook mapping; makes no Kubernetes calls and never fabricates health.
      required: [resource_context, incident, sla, health, evidence_sources, recent_events, recommended_actions]
      properties:
        resource_context:
          type: object
          required: [scope, observed_at, source, freshness, empty_sample]
          description: Resource-context contract shared across M112-M114 aggregates.
          properties:
            scope:
              type: object
              properties:
                cluster_id: { type: integer, format: int64 }
                namespace: { type: string }
                kind: { type: string }
                name: { type: string }
                source_type: { type: string }
            observed_at: { type: string, format: date-time }
            source: { type: string }
            freshness:
              type: object
              properties:
                age_seconds: { type: integer, format: int64 }
                as_of: { type: string, format: date-time }
            empty_sample:
              type: object
              description: 'Fail-closed empty-sample semantics: no data is never shown as healthy.'
              properties:
                count: { type: integer }
                bounded: { type: boolean }
                semantic: { type: string, enum: [fail_closed, safe_absent] }
        incident:
          type: object
          properties:
            id: { type: integer, format: int64 }
            number: { type: string }
            title: { type: string }
            severity: { type: string, enum: [info, warning, high, critical] }
            status: { type: string, enum: [open, confirmed, resolved, dismissed] }
            summary: { type: string }
            source_type: { type: string }
            resource: { $ref: '#/components/schemas/IncidentResource' }
            version: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        sla:
          type: object
          properties:
            due_at: { type: string, format: date-time }
            overdue: { type: boolean }
            remaining: { type: string }
            deadline_text: { type: string }
        health:
          type: object
          properties:
            status: { type: string }
            overdue: { type: boolean }
            evidence_available: { type: boolean }
            runbook_available: { type: boolean }
            note_count: { type: integer }
            system_event_count: { type: integer }
        evidence_sources:
          type: array
          items:
            type: object
            properties:
              source_type: { type: string }
              count: { type: integer }
              deep_link: { type: string }
        recent_events:
          type: array
          description: Timeline events newest-first, bounded to the last 10.
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              event_type: { type: string, enum: [system, note] }
              actor:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
              content: { type: string }
              created_at: { type: string, format: date-time }
        runbook_brief:
          type: object
          description: Present only when a runbook could be resolved from a trustworthy source domain.
          properties:
            domain: { type: string }
            finding_code: { type: string }
            diagnosis_routes: { type: integer }
            inspection_rules: { type: integer }
            operation_count: { type: integer }
        recommended_actions:
          type: array
          description: Read-only dry-run candidates from the runbook catalog; never executed from the cockpit.
          items:
            type: object
            properties:
              action: { type: string }
              target_kind: { type: string }
              dry_run_first: { type: boolean }
              summary: { type: string }
    IncidentChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      description: One conversational turn. The last message must be from the user.
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    IncidentChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      description: M112-2 chat request. History is bounded (default 20 messages); the client holds the conversation.
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/IncidentChatMessage' }
    IncidentChatResponse:
      type: object
      additionalProperties: false
      description: M112-2 chat response. Citations are validated against the authorized incident evidence set (fail-closed); deterministic fallback is used when AI is disabled or the provider fails.
      required: [incident_id, resource_context, mode, answer, citations, provider, model, input_tokens, output_tokens, fail_closed]
      properties:
        incident_id: { type: integer, format: int64 }
        resource_context:
          type: object
          description: Resource-context contract block (same shape as IncidentContextCockpit.resource_context).
          properties:
            scope:
              type: object
              properties:
                cluster_id: { type: integer, format: int64 }
                namespace: { type: string }
                kind: { type: string }
                name: { type: string }
                source_type: { type: string }
            observed_at: { type: string, format: date-time }
            source: { type: string }
            freshness:
              type: object
              properties:
                age_seconds: { type: integer, format: int64 }
                as_of: { type: string, format: date-time }
            empty_sample:
              type: object
              properties:
                count: { type: integer }
                bounded: { type: boolean }
                semantic: { type: string, enum: [fail_closed, safe_absent] }
        mode: { type: string, enum: [ai, deterministic] }
        answer: { type: string }
        next_checks:
          type: array
          description: Bounded next-step checks (max 8).
          items: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [evidence_id, claim]
            properties:
              evidence_id: { type: string }
              claim: { type: string }
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        fail_closed: { type: boolean }
    IncidentSummaryResponse:
      type: object
      additionalProperties: false
      description: M112-3 cited incident summary. The deterministic stage gate decides whether AI is engaged; when AI is blocked or fails, mode is deterministic and fail_closed indicates a provider/validation fallback.
      required: [incident_id, resource_context, mode, root_cause_candidate, impact, evidence_summary, next_steps, citations, provider, model, input_tokens, output_tokens, fail_closed, stage_gate_passed]
      properties:
        incident_id: { type: integer, format: int64 }
        resource_context:
          type: object
          description: Resource-context contract block (same shape as IncidentContextCockpit.resource_context).
          properties:
            scope:
              type: object
              properties:
                cluster_id: { type: integer, format: int64 }
                namespace: { type: string }
                kind: { type: string }
                name: { type: string }
                source_type: { type: string }
            observed_at: { type: string, format: date-time }
            source: { type: string }
            freshness:
              type: object
              properties:
                age_seconds: { type: integer, format: int64 }
                as_of: { type: string, format: date-time }
            empty_sample:
              type: object
              properties:
                count: { type: integer }
                bounded: { type: boolean }
                semantic: { type: string, enum: [fail_closed, safe_absent] }
        mode: { type: string, enum: [ai, deterministic] }
        root_cause_candidate:
          type: string
          description: Root cause candidate only; never a confirmed root cause (operators confirm).
        impact: { type: string }
        evidence_summary: { type: string }
        next_steps:
          type: array
          items: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [evidence_id, claim]
            properties:
              evidence_id: { type: string }
              claim: { type: string }
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        fail_closed: { type: boolean }
        stage_gate_passed: { type: boolean }
        stage_gate_reason: { type: string }
    DiagnosisTimelineEntry:
      type: object
      description: One normalized evidence item on the diagnosis timeline (M94 read-only projection)
      required: [index, category, type, source, ref, integrity, missing, summary]
      properties:
        index: { type: integer }
        category: { type: string, enum: [resource_state, event, log, alert, change, automation] }
        type: { type: string, description: Underlying evidence type, e.g. node_condition, container_termination }
        source: { type: string }
        ref: { type: string, description: Immutable evidence reference, e.g. diagnosis:<id>:evidence:<index> or event/<name> }
        integrity: { type: string, description: SHA-256 hex of the canonical evidence JSON }
        occurred_at: { type: string, format: date-time, description: 'RFC3339 observation time when extractable, otherwise omitted' }
        missing: { type: boolean, description: 'True when evidence is explicitly absent, e.g. a missing Ready condition' }
    DiagnosisReplayStep:
      type: object
      description: One replayable event on the diagnosis insight chain (M94 replay mode; assembled strictly from stored artifacts)
      required: [index, stage, type, summary, ref]
      properties:
        index: { type: integer }
        stage: { type: string, enum: [diagnosis_created, evidence, activity, ai_explanation, remediation], description: M81 insight-chain stage }
        category: { type: string, enum: [resource_state, event, log, alert, change, automation] }
        type: { type: string, description: Step kind, e.g. node_condition, status_transition, ai_explanation, remediation_executed }
        summary: { type: string }
        integrity: { type: string, description: SHA-256 hex when the step carries evidence content }
        ref: { type: string, description: Immutable step reference, e.g. diagnosis:<id>:evidence:<index> }
        occurred_at: { type: string, format: date-time, description: RFC3339 event time; omitted when unknown }
        missing: { type: boolean, description: 'True when the evidence is explicitly absent' }
        missing_reason: { type: string }
        detail: { type: object, additionalProperties: true, description: Optional step metadata (actor, comment, provider, model, action, status) }
    DiagnosisReplayStage:
      type: object
      description: Stage summary of a replay
      required: [stage, label, count]
      properties:
        stage: { type: string, enum: [diagnosis_created, evidence, activity, ai_explanation, remediation] }
        label: { type: string }
        count: { type: integer }
    DiagnosisReplayView:
      type: object
      description: Read-only replay projection of a diagnosis (M94 replay mode)
      required: [schema, diagnosis_id, rule_id, severity, resource, observed_at, steps, stages]
      properties:
        schema: { type: string, enum: [aiops.diagnosis-replay/v1] }
        diagnosis_id: { type: integer, format: int64 }
        rule_id: { type: string }
        severity: { type: string }
        resource: { type: object, properties: { kind: { type: string }, namespace: { type: string }, name: { type: string }, uid: { type: string } } }
        observed_at: { type: string, format: date-time }
        steps: { type: array, items: { $ref: '#/components/schemas/DiagnosisReplayStep' } }
        stages: { type: array, items: { $ref: '#/components/schemas/DiagnosisReplayStage' } }
        missing_reason: { type: string }
        summary: { type: string }
    RootCauseCard:
      type: object
      description: 'First-screen diagnosis summary: conclusion, severity, first observation and key evidence refs (M94)'
      required: [conclusion, severity, status, first_observed_at, confidence, confidence_source, resource, key_evidence_refs]
      properties:
        conclusion: { type: string }
        severity: { type: string, enum: [info, warning, high, critical] }
        status: { type: string }
        first_observed_at: { type: string, format: date-time }
        confidence: { type: string, description: deterministic for rule-derived conclusions }
        confidence_source: { type: string, description: Rule ID that produced the conclusion }
        resource:
          type: object
          required: [kind, name]
          properties:
            kind: { type: string }
            namespace: { type: string }
            name: { type: string }
            uid: { type: string }
        key_evidence_refs:
          type: array
          description: Immutable refs of up to 5 non-missing evidence items backing the conclusion
          items: { type: string }
    DiagnosisAction:
      type: object
      description: 'One typed entry in the M94 diagnosis action area: read-only advisory vs controlled capability'
      required: [kind, title, requires_dry_run, requires_confirmation]
      properties:
        kind: { type: string, enum: [advisory, controlled_action] }
        title: { type: string }
        detail: { type: string }
        action: { type: string, description: Controlled operation identifier, e.g. deployment.rollout_restart }
        requires_dry_run: { type: boolean, description: 'True when execution requires a Kubernetes dry-run preview first' }
        requires_confirmation: { type: boolean, description: 'True when execution requires explicit human confirmation' }
    DiagnoseNodeMetricsRequest:
      type: object
      additionalProperties: false
      required: [name, metric, operator, threshold, for_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 253, description: Node name }
        metric: { type: string, enum: [node_cpu, node_memory] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64, minimum: 0, description: 'nanocores for node_cpu, bytes for node_memory' }
        for_seconds: { type: integer, minimum: 60, maximum: 86400 }
        minimum_points: { type: integer, minimum: 2, maximum: 1440, default: 2 }
    RemediationPreviewRequest: { type: object, required: [action, target_name], properties: { action: { type: string, enum: [deployment.rollout_restart] }, target_name: { type: string, maxLength: 253 } } }
    ControlledOperationPreviewRequest:
      oneOf:
        - $ref: '#/components/schemas/DeploymentScaleOperation'
        - $ref: '#/components/schemas/CronJobScheduleOperation'
        - $ref: '#/components/schemas/DeploymentImageUpdateOperation'
        - $ref: '#/components/schemas/DeploymentRollbackOperation'
    DeploymentScaleOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, desired_replicas], properties: { action: { type: string, enum: [deployment.scale] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, desired_replicas: { type: integer, minimum: 0, maximum: 1000 } } }
    CronJobScheduleOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name], properties: { action: { type: string, enum: [cronjob.suspend, cronjob.resume] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 } } }
    DeploymentImageUpdateOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, container_name, desired_image], properties: { action: { type: string, enum: [deployment.image_update] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, container_name: { type: string, maxLength: 253 }, desired_image: { type: string, maxLength: 512 } } }
    DeploymentRollbackOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, rollback_revision], properties: { action: { type: string, enum: [deployment.rollback] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, rollback_revision: { type: integer, minimum: 1 } } }
    RemediationExecuteRequest: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string, writeOnly: true } } }
    PromotionPreviewRequest:
      type: object
      additionalProperties: false
      required: [source_cluster_id, destination_cluster_id, source_namespace, destination_namespace, bundle]
      properties:
        source_cluster_id: { type: integer, format: int64, minimum: 1 }
        destination_cluster_id: { type: integer, format: int64, minimum: 1 }
        source_namespace: { type: string, maxLength: 63 }
        destination_namespace: { type: string, maxLength: 63 }
        bundle:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/PromotionBundleItem' }
        dependency_mappings:
          type: array
          items: { $ref: '#/components/schemas/PromotionDependencyMapping' }
    PromotionBundleItem:
      type: object
      additionalProperties: false
      required: [kind, namespace, name]

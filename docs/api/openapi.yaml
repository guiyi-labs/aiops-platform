  /api/v1/aiops/automation/plans/{plan_id}/verify:
    post:
      tags: [automation]
      summary: Evaluate post-action evidence and the server-owned rollback contract
      operationId: verifyAutomationPlan
      description: Captures the post-snapshot, compares against the pre-snapshot, and returns the final verification status. On failed or ineffective verification, a safe rollback plan may be created; unsafe rollbacks escalate to a human. Missing evidence never resolves a diagnosis automatically.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Action verification, content: { application/json: { schema: { $ref: '#/components/schemas/ActionVerification' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Plan is not in a verifiable status (must be succeeded or failed), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Automation service disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

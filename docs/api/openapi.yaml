  /api/v1/clusters/{cluster_id}/copy-plans/preview:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    post:
      summary: Preview an interactive cross-cluster copy plan (source cluster = path, target = body)
      operationId: previewCopyPlan
      security: [{ bearerAuth: [] }]
      tags: [copyops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyPlanPreviewRequest' }
      responses:
        '201': { description: Previewed copy plan awaiting confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/CopyPlan' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/clusters/{cluster_id}/copy-plans:
    parameters:
      - $ref: '#/components/parameters/ClusterID'
    get:
      summary: List copy plans scoped to this cluster (as source OR destination)
      operationId: listCopyPlansByCluster
      security: [{ bearerAuth: [] }]
      tags: [copyops]
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageSize'
      responses:
        '200': { description: Paginated copy plans for the cluster, content: { application/json: { schema: { $ref: '#/components/schemas/CopyPlanList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/copy-plans:
    get:
      summary: List copy plans for the calling user (cross-cluster, personal view)
      operationId: listMyCopyPlans
      security: [{ bearerAuth: [] }]
      tags: [copyops]
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageSize'
      responses:
        '200': { description: Paginated copy plans for current user, content: { application/json: { schema: { $ref: '#/components/schemas/CopyPlanList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/copy-plans/{plan_id}:
    parameters:
      - { name: plan_id, in: path, required: true, description: Copy plan ID (cp-* format), schema: { type: string, minLength: 36, maxLength: 36 } }
    get:
      summary: Get a copy plan by ID with status and resource_items projection
      operationId: getCopyPlan
      security: [{ bearerAuth: [] }]
      tags: [copyops]
      responses:
        '200': { description: Copy plan, content: { application/json: { schema: { $ref: '#/components/schemas/CopyPlan' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/copy-plans/{plan_id}/execute:
    parameters:
      - { name: plan_id, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
    post:
      summary: Execute a confirmed copy plan (confirmation token + idempotency key)
      operationId: executeCopyPlan
      security: [{ bearerAuth: [] }]
      tags: [copyops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyPlanExecuteRequest' }
      responses:
        '200': { description: Execution finished (ok/failed/partial), content: { application/json: { schema: { $ref: '#/components/schemas/CopyPlan' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: aiops_refresh }
  parameters:
    ClusterID: { name: cluster_id, in: path, required: true, schema: { type: integer, format: int64 } }
    UserID: { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } }
    SessionID: { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
    DiagnosisID: { name: diagnosis_id, in: path, required: true, schema: { type: integer, format: int64 } }
    IncidentID: { name: incident_id, in: path, required: true, schema: { type: integer, format: int64 } }
    ExplanationID: { name: explanation_id, in: path, required: true, schema: { type: integer, format: int64 } }
    DeliveryID: { name: delivery_id, in: path, required: true, schema: { type: integer, format: int64 } }
    RemediationID: { name: remediation_id, in: path, required: true, schema: { type: string, format: uuid } }
    PromotionID: { name: promotion_id, in: path, required: true, schema: { type: string, format: uuid } }
    FilterID: { name: filter_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    RuleID: { name: rule_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AlertID: { name: alert_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    Namespace: { name: namespace, in: path, required: true, schema: { type: string } }
    Name: { name: name, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    QueryPage: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    QueryPageSize: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    WorkspaceIDQuery: { name: workspace_id, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 }, description: 'Optional M46 workspace filter. When set, namespaced list results are narrowed to namespaces that belong to the workspace on the current cluster. Pure visibility filter — does NOT grant namespace read access (ADR 0062 §4).' }
  responses:
    Ok: { description: Successful JSON response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    User: { description: User response without password material, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    Login: { description: Login or refresh response, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
    Error: { description: Structured error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    # -------- M113-2 Capacity-aware preview --------
    CapacityPreviewRequest:
      type: object
      additionalProperties: false
      required: [cluster_id]
      properties:
        cluster_id: { type: integer, format: int64 }
        cpu_request_nanocores: { type: integer, format: int64, description: CPU request in nanocores }
        mem_request_bytes: { type: integer, format: int64, description: Memory request in bytes }
        gpu_request: { type: integer, format: int64, description: GPU device count }
        storage_request_bytes: { type: integer, format: int64, description: Ephemeral-storage request in bytes }
    CapacityPreview:
      type: object
      additionalProperties: false
      required: [cluster_id, evaluated_at, request, nodes_total, nodes_schedulable, fit_count, fail_closed, nodes]
      properties:
        cluster_id: { type: integer, format: int64 }
        evaluated_at: { type: string, format: date-time }
        request: { $ref: '#/components/schemas/CapacityPreviewRequest' }
        scope: { type: string, description: Resource-context scope (what this preview covers) }
        observed_at: { type: string, format: date-time, description: Newest underlying observation time }
        nodes_total: { type: integer }
        nodes_schedulable: { type: integer }
        fit_count: { type: integer }
        fail_closed: { type: boolean, description: True when any node lacked data and was excluded from fit_count }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, schedulable, ready, fits, unknown_count, score, constraints]
            properties:
              name: { type: string }
              schedulable: { type: boolean }
              ready: { type: boolean }
              fits: { type: boolean }
              unknown_count: { type: integer }
              score: { type: number, format: double }
              freshness: { type: string, format: date-time }
              constraints:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [resource, status]
                  properties:
                    resource: { type: string, enum: [cpu, memory, gpu, storage] }
                    status: { type: string, enum: [satisfied, violated, unknown] }
                    remaining: { type: integer, format: int64 }
                    required: { type: integer, format: int64 }
                    missing_names: { type: array, items: { type: string } }
                    note: { type: string }
    # -------- M80 Aggregated governance posture --------
    PostureReport:
      type: object
      required: [cluster_id, evaluated_at, domains, findings, by_severity, total_checks, failed_checks, passed_checks]
      properties:
        cluster_id: { type: integer }
        evaluated_at: { type: string, format: date-time }
        domains:
          type: array
          items: { $ref: '#/components/schemas/PostureDomainStatus' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/PostureFinding' }
        by_severity: { type: object, additionalProperties: { type: integer } }
        total_checks: { type: integer }
        failed_checks: { type: integer }
        passed_checks: { type: integer }
    PostureDomainStatus:
      type: object
      required: [domain, total, failed, passed]
      properties:
        domain:
          type: string
          enum: [cis, finops, deprecated_api, network, image, gitops, capacity, policy, hpa, pdb, ingress]
        total: { type: integer }
        failed: { type: integer }
        passed: { type: integer }
        by_severity: { type: object, additionalProperties: { type: integer } }
    PostureFinding:
      type: object
      required: [domain, severity, code, summary, resource, observed_at]
      properties:
        domain:
          type: string
          enum: [cis, finops, deprecated_api, network, image, gitops, capacity, policy, hpa, pdb, ingress]
        severity: { type: string, enum: [info, warning, critical] }
        code: { type: string }
        summary: { type: string }
        resource:
          type: object
          required: [kind, name]
          properties:
            kind: { type: string }
            namespace: { type: string }
            name: { type: string }
            uid: { type: string }
            resource_version: { type: string }
        details: { type: object, additionalProperties: { type: string } }
        observed_at: { type: string }
    # -------- M58 GitOps + Velero + CopyOps schemas --------
    GitOpsCapability:
      type: object
      required: [available, mode]
      properties:
        available: { type: boolean, description: Whether ArgoCD API/CRDs are reachable }
        mode: { type: string, enum: [none, direct_application_cr, argocd_api_proxy], description: Integration mode used }
        server_version: { type: string }
        application_count: { type: integer }
        sync_health_mapped: { type: boolean }
        last_probe_error: { type: string }
    GitOpsApplication:
      type: object
      description: Projected ArgoCD Application metadata + sync+health status
      required: [name, namespace, sync_status, health_status]
      properties:
        name: { type: string }
        namespace: { type: string }
        project: { type: string }
        sync_status: { type: string, enum: [Synced, OutOfSync, Unknown] }
        sync_revision: { type: string }
        health_status: { type: string, enum: [Healthy, Progressing, Degraded, Suspended, Missing, Unknown] }
        health_message: { type: string }
        repo_url: { type: string }
        repo_path: { type: string }
        repo_target_revision: { type: string }
        destination_cluster: { type: string }
        destination_namespace: { type: string }
        raw_manifest:
          description: Verbose raw Application CR JSON for the detail page
          type: object
          additionalProperties: true
        updated_at: { type: string, format: date-time }
    GitOpsApplicationList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GitOpsApplication' } }
        total: { type: integer }
        remaining: { type: integer, description: Remaining cursor (optional capability-aware hint) }
    VeleroRestoreList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            description: Projected Velero Restore row (GUI-friendly)
            required: [name, namespace, phase, backup_name]
            properties:
              name: { type: string }
              namespace: { type: string }
              backup_name: { type: string }
              phase: { type: string, enum: [New, InProgress, WaitingForPluginOperations, WaitingForPluginOperationsPartiallyFailed, Completed, PartiallyFailed, Failed] }
              errors: { type: integer }
              warnings: { type: integer }
              started_at: { type: string, format: date-time }
              completed_at: { type: string, format: date-time }
        total: { type: integer }
        remaining: { type: integer }
    CopyBundleItem:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, description: Source resource kind (must be in whitelist) }
        namespace: { type: string, description: Source namespace; defaults to the Preview request source_namespace }
        name: { type: string, description: Source resource name }
    CopyPlanPreviewRequest:
      type: object
      required: [target_cluster_id, target_namespace, bundle]
      properties:
        source_cluster_id: { type: integer, format: int64, description: Override source cluster; defaults to the path cluster_id }
        source_namespace: { type: string, description: Source namespace for the bundle (fallback for item-level namespace defaults) }
        target_cluster_id: { type: integer, format: int64 }
        target_namespace: { type: string }
        bundle:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/CopyBundleItem' }
        strip_secrets: { type: boolean, description: Redact values in Secret manifests when true }
        strip_label_prefixes: { type: array, items: { type: string } }
        strip_annotation_prefixes: { type: array, items: { type: string } }
    CopyPlanExecuteRequest:
      type: object
      required: [confirmation_token]
      properties:
        confirmation_token: { type: string, description: One-time token returned from Preview; hashed copy is persisted }
        idempotency_key: { type: string, description: Client-generated idempotency key; mirrored on the plan for replay safety }
    CopyItemDiff:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [create, update, delete, 'no-op'] }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        changed_fields: { type: array, items: { type: string } }
    CopyPlanResourceItem:
      type: object
      required: [kind, source_namespace, source_name, destination_namespace, destination_name, manifest, diff]
      properties:
        group: { type: string }
        version: { type: string }
        resource: { type: string }
        kind: { type: string }
        source_namespace: { type: string }
        source_name: { type: string }
        source_uid: { type: string }
        source_resource_version: { type: string }
        destination_namespace: { type: string }
        destination_name: { type: string }
        manifest: { type: object, additionalProperties: true, description: Scrubbed manifest projected for dry-run/apply }
        diff: { $ref: '#/components/schemas/CopyItemDiff' }
        item_status: { type: string, enum: [pending, applied, failed, skipped] }
        dry_run_error: { type: string }
        last_error: { type: string }
        preflight_skip: { type: string }
        applied_uid: { type: string }
        applied_rv: { type: string }
    CopyPlanDiffSummary:
      type: object
      properties:
        resource_count: { type: integer }
        target_namespace_exists: { type: boolean }
        will_create_count: { type: integer }
        will_skip_count: { type: integer }
        dry_run_errors: { type: array, items: { type: string } }
    CopyPlan:
      type: object
      required: [id, status, source_cluster_id, source_namespace, target_cluster_id, target_namespace]
      properties:
        id: { type: string, minLength: 36, maxLength: 36, description: cp-prefixed plan id }
        status: { type: string, enum: [awaiting_confirmation, executing, succeeded, failed, expired] }
        source_cluster_id: { type: integer, format: int64 }
        source_namespace: { type: string }
        source_namespace_uid: { type: string }
        source_namespace_resource_version: { type: string }
        target_cluster_id: { type: integer, format: int64 }
        target_namespace: { type: string }
        copy_summary:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              namespace: { type: string }
              name: { type: string }
              destination_namespace: { type: string }
              destination_name: { type: string }
        diff: { $ref: '#/components/schemas/CopyPlanDiffSummary' }
        resource_items:
          type: array
          items: { $ref: '#/components/schemas/CopyPlanResourceItem' }
        confirmation_token:
          type: string
          description: Returned ONLY from Preview (not persisted or shown in GET); single-use token for Execute
        expires_at: { type: string, format: date-time }
        executed_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CopyPlanList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CopyPlan' } }
        total: { type: integer }
        remaining: { type: integer }

    MetricHistoryResponse:
      type: object
      additionalProperties: false
      required: [series, from, to, points, coverage, limits, truncated]
      properties:
        series: { $ref: '#/components/schemas/MetricHistorySeries' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        points: { type: array, maxItems: 1440, items: { $ref: '#/components/schemas/MetricHistoryPoint' } }
        coverage: { $ref: '#/components/schemas/MetricHistoryCoverage' }
        limits: { $ref: '#/components/schemas/MetricHistoryLimits' }
        truncated: { type: boolean }
    MetricHistorySeries:
      type: object
      additionalProperties: false
      required: [cluster_id, resource_kind, resource_name, metric_name, unit]
      properties:
        cluster_id: { type: integer, format: int64, minimum: 1 }
        resource_kind: { type: string, enum: [Node, Pod] }
        resource_namespace: { type: string, maxLength: 63 }
        resource_name: { type: string, minLength: 1, maxLength: 253 }
        container_name: { type: string, maxLength: 253 }
        metric_name: { type: string, enum: [cpu, memory] }
        unit: { type: string, enum: [nanocores, bytes] }
    MetricHistoryPoint:
      type: object
      additionalProperties: false
      required: [value, source_timestamp, window_milliseconds, collected_at]
      properties:
        value: { type: integer, format: int64, minimum: 0 }
        source_timestamp: { type: string, format: date-time }
        window_milliseconds: { type: integer, minimum: 1000, maximum: 3600000 }
        collected_at: { type: string, format: date-time }
    MetricHistoryCoverage:
      type: object
      additionalProperties: false
      required: [collections, succeeded, partial, unavailable, timed_out, failed, points, missing]
      properties:
        collections: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        partial: { type: integer, minimum: 0 }
        unavailable: { type: integer, minimum: 0 }
        timed_out: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
    MetricHistoryLimits:
      type: object
      additionalProperties: false
      required: [max_window_seconds, max_points]
      properties:
        max_window_seconds: { type: integer, enum: [86400] }
        max_points: { type: integer, enum: [1440] }
    MetricHistoryEvaluationResponse:
      type: object
      additionalProperties: false
      required: [series, from, to, coverage, state, operator, threshold, for_seconds, minimum_points, points_evaluated, breaching_points, observed_span_seconds, sustained_windows, latest_firing_window]
      properties:
        series: { $ref: '#/components/schemas/MetricHistorySeries' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/MetricHistoryCoverage' }
        state: { type: string, enum: [firing, normal, insufficient_data] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64, minimum: 0 }
        for_seconds: { type: integer, minimum: 60, maximum: 86400 }
        minimum_points: { type: integer, minimum: 2, maximum: 1440 }
        points_evaluated: { type: integer, minimum: 0, maximum: 1440 }
        breaching_points: { type: integer, minimum: 0, maximum: 1440 }
        observed_span_seconds: { type: integer, format: int64, minimum: 0, maximum: 86400 }
        sustained_windows:
          type: array
          description: All detected sustained breach windows across the full series
          items: { $ref: '#/components/schemas/SustainedWindow' }
        latest_firing_window:
          $ref: '#/components/schemas/SustainedWindow'
          nullable: true
    SustainedWindow:
      type: object
      additionalProperties: false
      required: [start_collected_at, end_collected_at, breaching_points, span_seconds]
      properties:
        start_collected_at: { type: string, format: date-time }
        end_collected_at: { type: string, format: date-time }
        breaching_points: { type: integer, minimum: 1 }
        span_seconds: { type: integer, format: int64, minimum: 0 }
    SavedGlobalSearchFilterCreate:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        query: { type: string, minLength: 2, maxLength: 64 }
        namespace: { type: string, maxLength: 63, default: '' }
        kinds: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, description: Omission selects all four supported kinds, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
    SavedGlobalSearchFilterUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Name may be changed alone. Query, namespace and kinds must be supplied together when overwriting the query.
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        query: { type: string, minLength: 2, maxLength: 64 }
        namespace: { type: string, maxLength: 63 }
        kinds: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
    SavedGlobalSearchFilter:
      type: object
      required: [id, name, query, kinds, schema_version, compatible, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        query: { type: string }
        namespace: { type: string }
        kinds: { type: array, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
        schema_version: { type: integer }
        compatible: { type: boolean }
        incompatibility_code: { type: string, enum: [SCHEMA_VERSION, QUERY_SHAPE] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedGlobalSearchFilterList:
      type: object
      required: [items, total, limit]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } }
        total: { type: integer, minimum: 0, maximum: 20 }
        limit: { type: integer, enum: [20] }
    GlobalSearchResponse:
      type: object
      required: [query, kinds, items, total, remaining, clusters_total, clusters_searched, clusters_remaining, complete, failures, checked_at, limits]
      properties:
        query: { type: string }
        namespace: { type: string }
        kinds: { type: array, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
        items: { type: array, items: { $ref: '#/components/schemas/GlobalSearchItem' } }
        total: { type: integer, minimum: 0, description: Known matches in searched clusters and successful kind reads }
        remaining: { type: integer, minimum: 0, description: Known matches omitted by the result limit }
        clusters_total: { type: integer, minimum: 0, description: Enabled clusters present when the query started }
        clusters_searched: { type: integer, minimum: 0 }
        clusters_remaining: { type: integer, minimum: 0, description: Enabled clusters omitted by cluster_limit }
        complete: { type: boolean }
        failures: { type: array, items: { $ref: '#/components/schemas/GlobalSearchFailure' } }
        checked_at: { type: string, format: date-time }
        limits:
          type: object
          required: [max_clusters, max_concurrent_clusters, per_cluster_timeout_ms, max_results, per_kind_limit]
          properties:
            max_clusters: { type: integer }
            max_concurrent_clusters: { type: integer }
            per_cluster_timeout_ms: { type: integer }
            max_results: { type: integer }
            per_kind_limit: { type: integer }
    GlobalSearchItem:
      type: object
      required: [cluster_id, cluster_name, kind, namespace, name, health, summary]
      properties:
        cluster_id: { type: integer, format: int64 }
        cluster_name: { type: string }
        kind: { type: string, enum: [Pod, Deployment, Service, Ingress] }

        - { name: from, in: query, required: true, description: Inclusive RFC3339 bucket timestamp, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: Exclusive RFC3339 bucket timestamp; at most 30 days after from, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1440, default: 1440 } }
      responses:

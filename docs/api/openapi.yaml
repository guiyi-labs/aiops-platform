        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}/promote:
    post:
      tags: [federation]
      summary: Promote a member/standalone to host (operations_admin+)
      description: Promotes a cluster to the host role. The single-host invariant is enforced atomically. See ADR 0063.
      operationId: promoteFederationCluster
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      responses:
        '200': { description: Promoted cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}/demote:
    post:
      tags: [federation]
      summary: Demote the host to member or standalone (operations_admin+)
      operationId: demoteFederationCluster
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DemoteFederationClusterRequest' } } } }
      responses:
        '200': { description: Demoted cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}/heartbeat:
    post:
      tags: [federation]
      summary: Record a cluster heartbeat (operations_admin+)
      description: Updates last_heartbeat_at and optionally transitions federation_status. A heartbeat event is appended to the audit trail. See ADR 0063.
      operationId: recordFederationHeartbeat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/FederationHeartbeatRequest' } } } }
      responses:
        '200': { description: Heartbeat recorded, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}/status:

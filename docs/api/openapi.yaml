      properties:
        id: { type: integer, format: int64 }
        cluster_id: { type: integer, format: int64 }
        display_name: { type: string }
        resource_kind: { type: string, enum: [Node] }
        resource_name: { type: string }
        metric_name: { type: string, enum: [cpu, memory] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64 }
        for_seconds: { type: integer }
        minimum_points: { type: integer }

        rule_name: { type: string, maxLength: 256, default: '' }
        severity: { type: string, maxLength: 32, default: '' }
        dedupe_key: { type: string, minLength: 1, maxLength: 256 }
        group_interval: { type: string, description: 'Optional Go duration string between 30s and 1h' }
        repeat_interval: { type: string, description: 'Optional Go duration string between 1m and 24h' }
    AlertRoutePatch:

openapi: 3.0.3
info:
  title: AIOps Platform API
  version: 1.0.0
  description: >-
    Versioned HTTP contract for the AIOps platform. Sensitive credentials,
    passwords, tokens and Kubernetes evidence payloads are intentionally not
    represented in response schemas.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: users
  - name: clusters
  - name: kubernetes
  - name: diagnoses
  - name: ai
  - name: notifications
  - name: remediation
  - name: audit
  - name: fleet
paths:
  /api/v1/fleet/health:
    get: { tags: [fleet], summary: Compare bounded health samples across enabled clusters, operationId: getFleetHealth, security: [{ bearerAuth: [] }], parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }], responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } } }
  /api/v1/fleet/resources/search:
    get:
      tags: [fleet]
      summary: Search fixed resource kinds across a bounded enabled-cluster set
      operationId: searchFleetResources
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 63 } }
        - { name: kinds, in: query, description: Comma-separated subset of pods deployments services ingresses, schema: { type: string } }
        - { name: cluster_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Bounded global search response, content: { application/json: { schema: { $ref: '#/components/schemas/GlobalSearchResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/fleet/resources/search/filters:
    get:
      tags: [fleet]
      summary: List the current user's saved global-search filters
      operationId: listGlobalSearchFilters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User-owned saved filters and the fixed per-user limit, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [fleet]
      summary: Save the current bounded global-search query for the current user
      operationId: createGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterCreate' } } } }
      responses:
        '201': { description: Saved filter, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/fleet/resources/search/filters/{filter_id}:
    patch:
      tags: [fleet]
      summary: Rename a saved filter or overwrite it with a complete bounded query
      operationId: updateGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FilterID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterUpdate' } } } }
      responses:
        '200': { description: Updated saved filter, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [fleet]
      summary: Delete one of the current user's saved global-search filters
      operationId: deleteGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FilterID' }]
      responses:
        '204': { description: Saved filter deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      tags: [health]
      summary: Prometheus request metrics
      description: Internal scrape endpoint. Restrict it to a trusted monitoring network; it has no user authentication.
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /api/v1/health/live:
    get: { tags: [health], summary: Process liveness, operationId: healthLive, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/health/ready:
    get: { tags: [health], summary: Dependency readiness, operationId: healthReady, responses: { '200': { $ref: '#/components/responses/Ok' }, '503': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/login:
    post: { tags: [auth], summary: Create access and refresh session, operationId: login, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }, responses: { '200': { $ref: '#/components/responses/Login' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/refresh:
    post: { tags: [auth], summary: Rotate refresh cookie and issue access token, operationId: refresh, security: [{ refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Login' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/logout:
    post: { tags: [auth], summary: Revoke current refresh session, operationId: logout, security: [{ refreshCookie: [] }], responses: { '204': { description: Revoked } } }
  /api/v1/auth/me:
    get: { tags: [auth], summary: Current user, operationId: me, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/User' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/password-change:
    post: { tags: [auth], summary: Change own password, operationId: changePassword, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }, responses: { '204': { description: Password changed and sessions revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/sessions:
    get: { tags: [auth], summary: List own refresh sessions, operationId: sessions, security: [{ bearerAuth: [], refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/auth/sessions/{session_id}:
    delete: { tags: [auth], summary: Revoke another own session, operationId: revokeSession, security: [{ bearerAuth: [], refreshCookie: [] }], parameters: [{ $ref: '#/components/parameters/SessionID' }], responses: { '204': { description: Revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/sessions/revoke-others:
    post: { tags: [auth], summary: Revoke all other sessions, operationId: revokeOtherSessions, security: [{ bearerAuth: [], refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/users:
    get: { tags: [users], summary: List users, operationId: listUsers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [users], summary: Create user, operationId: createUser, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserWrite' } } } }, responses: { '201': { $ref: '#/components/responses/User' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/assignable:
    get: { tags: [users], summary: List assignable operators, operationId: assignableUsers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/users/{user_id}:
    patch: { tags: [users], summary: Update user status, display name or roles, operationId: updateUser, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }, responses: { '200': { $ref: '#/components/responses/User' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/password-reset:
    post: { tags: [users], summary: Reset another user's password, operationId: resetPassword, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }, responses: { '204': { description: Reset and sessions revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters:
    get: { tags: [clusters], summary: List registered clusters, operationId: listClusters, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [clusters], summary: Register encrypted kubeconfig, operationId: createCluster, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterWrite' } } } }, responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}:
    get: { tags: [clusters], summary: Cluster detail, operationId: getCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [clusters], summary: Enable or disable cluster, operationId: updateCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '204': { description: Updated } } }
    delete: { tags: [clusters], summary: Delete cluster and credential, operationId: deleteCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '204': { description: Deleted } } }
  /api/v1/clusters/{cluster_id}/credentials:
    put: { tags: [clusters], summary: Atomically replace encrypted kubeconfig, operationId: rotateClusterCredentials, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRotationRequest' } } } }, responses: { '204': { description: Replaced and probe state reset }, '400': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/probe:
    post: { tags: [clusters], summary: Probe cluster connectivity, operationId: probeCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/namespaces:
    get: { tags: [kubernetes], summary: List namespaces, operationId: listNamespaces, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/nodes:
    get: { tags: [kubernetes], summary: List nodes, operationId: listNodes, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/metrics/nodes:
    get: { tags: [kubernetes], summary: List bounded Node metrics, operationId: listNodeMetrics, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' }, '424': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/metrics/pods:
    get: { tags: [kubernetes], summary: List bounded Pod metrics, operationId: listPodMetrics, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' }, '424': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/nodes/{name}:
    get: { tags: [kubernetes], summary: Node detail, operationId: getNode, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/pods:
    get: { tags: [kubernetes], summary: List pods, operationId: listPods, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/events:
    get: { tags: [kubernetes], summary: List events, operationId: listEvents, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/deployments:
    get: { tags: [kubernetes], summary: List deployments, operationId: listDeployments, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/deployments/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Deployment detail, operationId: getDeployment, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/statefulsets:
    get: { tags: [kubernetes], summary: List StatefulSets, operationId: listStatefulSets, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/statefulsets/{namespace}/{name}:
    get: { tags: [kubernetes], summary: StatefulSet detail, operationId: getStatefulSet, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/daemonsets:
    get: { tags: [kubernetes], summary: List DaemonSets, operationId: listDaemonSets, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/daemonsets/{namespace}/{name}:
    get: { tags: [kubernetes], summary: DaemonSet detail, operationId: getDaemonSet, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/replicasets:
    get: { tags: [kubernetes], summary: List ReplicaSets, operationId: listReplicaSets, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/replicasets/{namespace}/{name}:
    get: { tags: [kubernetes], summary: ReplicaSet detail, operationId: getReplicaSet, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/jobs:
    get: { tags: [kubernetes], summary: List Jobs, operationId: listJobs, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/jobs/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Job detail, operationId: getJob, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/cronjobs:
    get: { tags: [kubernetes], summary: List CronJobs, operationId: listCronJobs, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/cronjobs/{namespace}/{name}:
    get: { tags: [kubernetes], summary: CronJob detail, operationId: getCronJob, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/horizontalpodautoscalers:
    get: { tags: [kubernetes], summary: List sanitized HPAs, operationId: listHorizontalPodAutoscalers, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/horizontalpodautoscalers/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Sanitized HPA detail, operationId: getHorizontalPodAutoscaler, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/resourcequotas:
    get: { tags: [kubernetes], summary: List ResourceQuotas, operationId: listResourceQuotas, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/resourcequotas/{namespace}/{name}:
    get: { tags: [kubernetes], summary: ResourceQuota detail, operationId: getResourceQuota, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/limitranges:
    get: { tags: [kubernetes], summary: List LimitRanges, operationId: listLimitRanges, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/limitranges/{namespace}/{name}:
    get: { tags: [kubernetes], summary: LimitRange detail, operationId: getLimitRange, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/secrets:
    get: { tags: [kubernetes], summary: List Secret metadata and key names without values, operationId: listSecrets, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/secrets/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Secret metadata and key names without values or annotations, operationId: getSecret, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/services:
    get: { tags: [kubernetes], summary: List services, operationId: listServices, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/services/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Service detail, operationId: getService, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/ingresses:
    get: { tags: [kubernetes], summary: List ingresses, operationId: listIngresses, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/ingresses/{namespace}/{name}:
    get: { tags: [kubernetes], summary: Ingress detail, operationId: getIngress, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Namespace' }, { $ref: '#/components/parameters/Name' }], responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/endpointslices:
    get: { tags: [kubernetes], summary: List sanitized EndpointSlices, operationId: listEndpointSlices, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/persistentvolumeclaims:
    get: { tags: [kubernetes], summary: List persistent volume claims, operationId: listPersistentVolumeClaims, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: query, schema: { type: string } }, { name: name, in: query, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/persistentvolumeclaims/{namespace}/{name}:

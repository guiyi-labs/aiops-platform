      properties:
        id: { type: integer, format: int64 }
        case_id: { type: integer, format: int64 }
        change_event_id: { type: integer, format: int64 }
        rule_id: { type: string, maxLength: 128 }
        confidence: { type: string, enum: [confirmed, candidate, contradicted, unknown] }
        rank: { type: integer, minimum: 1, maximum: 10 }
        factors:
          type: array
          maxItems: 32

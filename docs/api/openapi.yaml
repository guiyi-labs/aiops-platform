      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VeleroBackup' } }
        total: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0, description: Number of remaining results beyond the current page }
    NamespacePosture:
      type: object
      required: [name, phase, resource_quotas, limit_ranges, workloads, pods, pdbs, node_capacity, partial_sections, overall_state, findings]
      properties:
        name: { type: string }
        phase: { type: string }
        resource_quotas: { type: object }
        limit_ranges: { type: object }
        workloads: { type: object }
        pods: { type: object }
        pdbs: { type: object }
        node_capacity: { type: object }
        partial_sections: { type: array, items: { type: string } }
        overall_state: { type: string, enum: [healthy, warning, critical, incomplete] }
        findings:
          type: array
          items:
            type: object
            required: [code, severity, summary, resource, observed_at]
            properties:
              code: { type: string, enum: [MISSING_QUOTA, EXHAUSTED_QUOTA, QUOTA_PRESSURE, MISSING_LIMIT_RANGE_DEFAULTS, MISSING_CONTAINER_REQUESTS, MISSING_CONTAINER_LIMITS, BEST_EFFORT_WORKLOAD, NO_MATCHING_PDB, BLOCKED_PDB_DISRUPTIONS, NODE_UNSCHEDULABLE, NODE_PRESSURE, REQUESTED_CAPACITY_THRESHOLD, INCOMPLETE_EVIDENCE] }
              severity: { type: string, enum: [info, warning, critical] }
              summary: { type: string }
              resource:
                type: object
                required: [kind, name]
                properties:
                  kind: { type: string }
                  namespace: { type: string }
                  name: { type: string }
                  uid: { type: string }
                  resource_version: { type: string }
              details: { type: object, additionalProperties: { type: string } }
              observed_at: { type: string, format: date-time }
    AlertRuleCreate:

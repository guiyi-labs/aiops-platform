        '200': { description: List of maintenance plans, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/maintenance-plans/preview:
    post:
      tags: [maintenance]
      summary: Preview a Node maintenance plan
      description: Runs preconditions (worker Node, cordon/uncordon/drain state checks), classifies resident Pods into retained/evictable/blocking, performs a server-side dry-run Node patch (cordon/uncordon), and persists an awaiting-confirmation plan with a one-time confirmation token.
      operationId: previewMaintenancePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Maintenance plan awaiting confirmation, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/maintenance-plans/{plan_id}/execute:
    post:
      tags: [maintenance]
      summary: Execute a maintenance plan
      description: Claims the plan with a one-time confirmation token and an Idempotency-Key header, then performs cordon/uncordon patch or bounded PDB-aware eviction. Force deletion, PDB bypass, emptyDir deletion, arbitrary Pod delete, and auto-uncordon after failed drain are prohibited.
      operationId: executeMaintenancePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: plan_id, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string } } } } } }
      responses:
        '200': { description: Executed maintenance plan, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/restore-plans:
    get:
      tags: [restore]
      summary: List restore rehearsal plans for a cluster
      operationId: listRestorePlans
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of restore rehearsal plans, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/restore-plans/preview:
    post:
      tags: [restore]
      summary: Preview an isolated workload restore rehearsal plan
      description: Runs preflight checks (Velero installed, source Backup Completed and M28-compatible single-namespace scope, destination Namespace absent, no active plan for the same source, Restore name available) and server-side dry-runs of the quarantine controls (default-deny NetworkPolicy + zero-Pod ResourceQuota) and Restore CR. Persists an awaiting-confirmation plan with a one-time confirmation token.
      operationId: previewRestorePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source_backup_name, source_backup_namespace], properties: { source_backup_name: { type: string }, source_backup_namespace: { type: string } } } } } }
      responses:
        '201': { description: Restore rehearsal plan awaiting confirmation, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/restore-plans/{plan_id}/execute:
    post:
      tags: [restore]
      summary: Execute an isolated workload restore rehearsal plan
      description: Claims the plan with a one-time confirmation token and an Idempotency-Key header, then creates the quarantine Namespace, NetworkPolicy, ResourceQuota, and Velero Restore CR; polls until terminal; projects restored items by allowlisted kinds. In-place restore, PV restore, cross-cluster restore, cutover/rollback, operator-supplied destination names, and arbitrary include/exclude lists are prohibited.
      operationId: executeRestorePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: plan_id, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string } } } } } }
      responses:
        '200': { description: Executed restore rehearsal plan, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/capability/metrics:
    get:
      tags: [capability]
      summary: Query fixed-template SLI metrics from a configured provider
      description: Returns normalized SLI series for one of the fixed templates (request_rate, error_rate, latency_p99, cpu_usage, memory_usage). Clients cannot inject PromQL; the provider endpoint is server-configured. Provider-side failures surface as an unavailable result state, never as raw provider error text.
      operationId: queryCapabilityMetrics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cluster_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: namespace, in: query, required: true, schema: { type: string, maxLength: 63 } }
        - { name: service, in: query, schema: { type: string, maxLength: 253 } }
        - { name: pod, in: query, schema: { type: string, maxLength: 253 } }
        - { name: container, in: query, schema: { type: string, maxLength: 253 } }
        - { name: template, in: query, required: true, schema: { type: string, enum: [request_rate, error_rate, latency_p99, cpu_usage, memory_usage] } }
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: step, in: query, required: true, schema: { type: string, description: Positive Go duration string, e.g. 30s or 1m } }
      responses:
        '200': { description: Normalized SLI metrics result, content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityMetricsResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/capability/logs:
    post:
      tags: [capability]
      summary: Query read-only historical logs from a configured provider
      description: Returns bounded historical log entries for a namespace and optional pod/container/text filter. Clients cannot inject LogQL; the provider endpoint is server-configured. Range hard-stops at 7 days. Provider-side failures surface as an unavailable result state, never as raw provider error text.
      operationId: queryCapabilityLogs
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityLogQuery' }
      responses:
        '200': { description: Normalized historical log result, content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityLogResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/capability/providers:
    get:
      tags: [capability]
      summary: List the compile-time provider catalog with runtime state
      description: Returns all registered providers (M60 static registry) ordered by name, each projected with its declared dependencies, cluster-role gate, configured flag, and the current runtime state (disabled / enabled / starting / stopping / degraded / unhealthy). Requires system_ops_admin because the catalog exposes deployment topology and internal deployment details. When `refresh=true` the response runs a per-provider health probe (bounded by the registry timeout) before returning; otherwise cached state is returned.
      operationId: listCapabilityProviders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: refresh
          in: query
          description: When true, run an inline per-provider health probe before returning the list.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: Provider catalog list with aggregate generation timestamp.
          content:
            application/json:
              schema:
                type: object
                required: [items, generated_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProviderInfo' } }
                  generated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/capability/providers/{name}:
    get:
      tags: [capability]
      summary: Get a single provider with a fresh health probe
      description: Returns a single provider descriptor plus an inline, always-fresh health probe (bypasses the registry-level 1s cache). Unknown provider names return 404, preserving 404>403 anti-leakage semantics. Requires system_ops_admin.
      operationId: getCapabilityProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          description: Provider name (compile-time stable identifier, DNS-1123 style lowercase slug).
          schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$', maxLength: 64 }
      responses:
        '200': { description: Single provider with state and optional inline health probe result, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderInfo' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/receivers:
    get:
      tags: [alert-routes]
      summary: List the current user's webhook receivers
      operationId: listAlertReceivers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User-owned webhook receivers (URLs masked, secrets never returned), content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertReceiverView' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [alert-routes]
      summary: Register a webhook receiver
      description: Creates a per-user webhook receiver. The URL must be HTTPS and the secret must be at least 32 characters. Both are stored encrypted; the secret is never returned in any response. Names are unique per user and bounded to 64 characters.
      operationId: createAlertReceiver
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertReceiverCreate' } } } }
      responses:
        '201': { description: Created webhook receiver, content: { application/json: { schema: { $ref: '#/components/schemas/AlertReceiverView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/receivers/{id}:
    delete:
      tags: [alert-routes]
      summary: Delete a webhook receiver
      description: Deletes a receiver if no routes reference it. Fails with RECEIVER_IN_USE while any route still points to the receiver.
      operationId: deleteAlertReceiver
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes:
    get:
      tags: [alert-routes]
      summary: List the current user's alert routes
      operationId: listAlertRoutes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User-owned alert routes ordered by priority then id, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertRouteView' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [alert-routes]
      summary: Create an alert route
      description: "Creates an exact-match route that maps firing/resolved alerts for an optional cluster, rule and severity to a receiver. Priority is 1..100 (lower = higher priority). The dedupe_key template renders to a stable per-(route, event) key so duplicate alert events produce a single delivery. Limits: 50 routes per user."
      operationId: createAlertRoute
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRouteCreate' } } } }
      responses:
        '201': { description: Created alert route, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRouteView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/{id}:
    patch:
      tags: [alert-routes]
      summary: Update an alert route
      description: Updates priority, enabled, group_interval or repeat_interval. All other fields are immutable after creation. Group interval is bounded to 30s..1h and repeat interval to 1m..24h.
      operationId: updateAlertRoute
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRoutePatch' } } } }
      responses:
        '200': { description: Updated alert route, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRouteView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alert-routes]
      summary: Delete an alert route
      operationId: deleteAlertRoute
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/silences:
    get:
      tags: [alert-routes]
      summary: List the current user's silences
      operationId: listAlertSilences
      security: [{ bearerAuth: [] }]
      parameters: [{ name: active, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: User-owned silences ordered by end time, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertSilenceView' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [alert-routes]
      summary: Create a time-bounded silence
      description: "Creates a silence that suppresses matching alerts (optional cluster, rule, severity) between starts_at and ends_at. Permanent silences are forbidden: the maximum duration is 7 days, the minimum is 5 minutes, and ends_at must be in the future. A non-empty reason (1..500 chars) is required so every silence is auditable. Limits: 30 silences per user."
      operationId: createAlertSilence
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertSilenceCreate' } } } }
      responses:
        '201': { description: Created silence, content: { application/json: { schema: { $ref: '#/components/schemas/AlertSilenceView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/silences/{id}:
    delete:
      tags: [alert-routes]
      summary: Delete a silence
      operationId: deleteAlertSilence
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/inhibits:
    get:
      tags: [alert-routes]
      summary: List the current user's alert inhibits
      operationId: listAlertInhibits
      security: [{ bearerAuth: [] }]
      parameters: [{ name: enabled, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: User-owned inhibits ordered by id, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertInhibitView' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [alert-routes]
      summary: Create an alert inhibit (source_match suppresses target_match)
      description: "Creates an inhibit rule: while any firing alert matches the source, alerts matching the target are suppressed. Unlike a silence, an inhibit is not time-bounded; suppression depends on the source alert's active state (a non-resolved delivery within the active window, re-evaluated on every MatchAndDeliver call). All match fields are optional (empty/nil = match any). A non-empty reason (1..500 chars) is required for auditability. Limits: 30 inhibits per user. Available to operations admins and system admins."
      operationId: createAlertInhibit
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertInhibitCreate' } } } }
      responses:
        '201': { description: Created inhibit, content: { application/json: { schema: { $ref: '#/components/schemas/AlertInhibitView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/inhibits/{id}:
    delete:
      tags: [alert-routes]
      summary: Delete an alert inhibit
      operationId: deleteAlertInhibit
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/alert-routes/deliveries:
    get:
      tags: [alert-routes]
      summary: List alert-route delivery records
      description: Returns an audit-oriented, paginated list of delivery records. Optional status filter (pending, delivering, delivered, dead). Available to security auditors and system admins.
      operationId: listAlertRouteDeliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivering, delivered, dead] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated delivery records, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRouteDeliveryList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/aiops/inspection/rules/catalog:
    get:
      tags: [aiops]
      summary: List the global inspection rule catalog
      operationId: inspectionRulesCatalog
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Compile-time rule catalog
          content:
            application/json:
              schema: { type: array }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/aiops/inspection/plans:
    get:
      tags: [aiops]
      summary: List inspection plans
      operationId: listInspectionPlans
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Paged plan list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [aiops]
      summary: Create an inspection plan
      operationId: createInspectionPlan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionPlanView' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/aiops/inspection/plans/{id}:
    get:
      tags: [aiops]
      summary: Get one inspection plan
      operationId: getInspectionPlan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Plan detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionPlanView' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [aiops]
      summary: Delete an inspection plan
      operationId: deleteInspectionPlan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/aiops/inspection/run:
    post:
      tags: [aiops]
      summary: Trigger a one-off inspection run
      operationId: runInspectionOnce
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted, background run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionTaskView' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/aiops/inspection/tasks:
    get:
      tags: [aiops]
      summary: List inspection execution tasks
      operationId: listInspectionTasks
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, running, completed, failed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Paged task list
          content:
            application/json:
              schema:
                type: object
                properties:

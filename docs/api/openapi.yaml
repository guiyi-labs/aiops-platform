  /api/v1/clusters/{cluster_id}/events/cockpit:
    get:
      tags: [kubernetes]
      summary: M114-2 event cockpit — bounded aggregation of repeated Kubernetes Events
      description: "Read-only aggregation of Kubernetes Events grouped by severity, reason, namespace, kind and resource within a bounded time window. Returns deduplicated groups (event_count, raw_count, first_seen, last_seen, sample_message, resource deep-link UID), a per-day trend, and total counts. fail-closed: an empty window is reported with fail_closed=true and is never treated as healthy (M99-D visibility convention). All queries are bounded: window_minutes (1-10080, default 1440), max_groups (1-200, default 50) and page_limit (1-1000, default 500)."
      operationId: eventCockpit
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: window_minutes, in: query, schema: { type: integer, minimum: 1, maximum: 10080, default: 1440 }, description: Trailing minutes to aggregate }
        - { name: max_groups, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, description: Cap on returned groups }
        - { name: page_limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }, description: Events fetched per namespace }
      responses:
        '200':
          description: Event cockpit aggregation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCockpitResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/events/stream:
    get:
      tags: [kubernetes]
      summary: Bounded SSE event stream over Kubernetes Events
      description: "Opens a Server-Sent Events stream of recent Kubernetes Events for the cluster. The stream is a bounded poller (not a Kubernetes Watch) over the read-only gateway (ADR 0066). The caller's M35 namespace scope is honoured — all-namespaces scope polls cluster-wide, otherwise the stream polls each authorized namespace. An empty scope (no grants, not all-namespaces) yields an immediately-closed empty stream so unauthorized namespaces are not leaked (404 > 403 anti-leakage, ADR 0066 §3). The optional ?namespace= query param narrows the scope to that single namespace (404 when unauthorized). Events are deduped by UID and pushed as SSE event messages with an EventSummary payload; the stream opens with a single hello event and closes with a final stream-closed event. Buffer cap (256) implements drop-oldest backpressure. Returns 503 when the eventstream service is not configured."
      operationId: streamClusterEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: namespace, in: query, schema: { type: string, maxLength: 253 }, description: 'Optional namespace filter. When present, the scope is narrowed to that single namespace (404 when unauthorized). When absent, the M35 resolved scope is used.' }
      responses:
        '200':
          description: SSE event stream (text/event-stream). Emits hello/event/stream-closed events.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStreamMessage' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Event stream service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

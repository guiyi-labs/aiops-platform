      operationId: alertOverview
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: window_minutes, in: query, schema: { type: integer, minimum: 1, maximum: 10080, default: 1440 } }
        - { name: max_groups, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 }, description: Rules and instances fetch cap }
      responses:
        '200':
          description: Alert noise-reduction aggregation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertOverviewResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

openapi: 3.0.3
info:
  title: AIOps Platform API
  version: 1.0.0
  description: >-
    Versioned HTTP contract for the AIOps platform. Sensitive credentials,
    passwords, tokens and Kubernetes evidence payloads are intentionally not
    represented in response schemas.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: users
  - name: clusters
  - name: kubernetes
  - name: diagnoses
  - name: incidents
  - name: ai
  - name: notifications
  - name: remediation
  - name: audit
  - name: fleet
  - name: metrics-history
  - name: alert-rules
  - name: alerts
  - name: access-grants
  - name: capability
  - name: alert-routes
  - name: aiops
  - name: slo
  - name: optimization
paths:
  /api/v1/optimization/cis/analyze:
    post:
      tags: [optimization]
      summary: Run the CIS Kubernetes Benchmark posture check over a supplied observation bundle
      operationId: analyzeCISPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: CIS observation bundle (components, workloads, bindings, namespaces) for one cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/capacity/preview:
    post:
      tags: [optimization]
      summary: M113-2 capacity-aware preview — rank nodes by remaining headroom
      operationId: capacityPreview
      description: 'Reads live node allocatable capacity + usage via the read-only kubernetes gateway, evaluates a candidate workload request against every node, and returns nodes ranked best-fit first with per-constraint "why fits / why not" explanations and data freshness. Read-only remediation preview; never writes.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacityPreviewRequest' }
      responses:
        '200':
          description: Ranked capacity preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/finops/analyze:
    post:
      tags: [optimization]
      summary: Produce FinOps right-sizing recommendations and cost-waste estimates over supplied container usage
      operationId: analyzeFinOps
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Per-container request/limit/usage bundle plus optional cost rate override
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/deprecated-api/analyze:
    post:
      tags: [optimization]
      summary: Check supplied Kubernetes objects for deprecated or removed apiVersions against a target version
      operationId: analyzeDeprecatedAPI
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Target Kubernetes minor version plus the object list (apiVersion, kind, name, namespace)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/network/analyze:
    post:
      tags: [optimization]
      summary: Statically analyse network reachability and NetworkPolicy posture for one cluster
      operationId: analyzeNetworkPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Network observation bundle (namespaces, pods, services, network policies); omit the bundle to auto-collect from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/image/analyze:
    post:
      tags: [optimization]
      summary: Statically analyse container image supply-chain and reproducibility for one cluster
      operationId: analyzeImagePosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Image observation bundle (per-container image usages); omit the bundle to auto-collect from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/gitops/analyze:
    post:
      tags: [optimization]
      summary: Detect GitOps configuration drift for one cluster (last-applied-configuration vs live)
      operationId: analyzeGitOpsPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitOps drift observation bundle (resources with last-applied-configuration + live spec/data, plus managed namespaces); omit the bundle to auto-collect from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/capacity/analyze:
    post:
      tags: [optimization]
      summary: Predict cluster CPU/memory saturation from observed capacity and usage trend
      operationId: analyzeCapacityPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Capacity trend observation bundle (per-resource allocatable capacity plus a usage sample series, with an optional projection horizon in days); omit the bundle to auto-collect node capacity and metrics history from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/policy/analyze:
    post:
      tags: [optimization]
      summary: Evaluate workload manifests against the declarative policy baseline (resources, security context, host access, probes)
      operationId: analyzePolicyPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Policy observation bundle (workload controllers with container resource/security-context/probe fields plus host access flags); omit the bundle to auto-collect workloads from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/hpa/analyze:
    post:
      tags: [optimization]
      summary: Evaluate HorizontalPodAutoscaler scaling posture (target metric, max-replica headroom, utilization vs target)
      operationId: analyzeHPAPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: HPA observation bundle (scaling bounds, current replicas, declared target metric and current utilization); omit the bundle to auto-collect HPAs from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/pdb/analyze:
    post:
      tags: [optimization]
      summary: Evaluate PodDisruptionBudget protection (coverage, budget achievability, disruption state)
      operationId: analyzePDBPosture
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: PDB observation bundle (replicable workloads with labels plus PodDisruptionBudgets with budget and disruption state); omit the bundle to auto-collect from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/ingress/analyze:
    post:
      tags: [optimization]
      summary: Audit Ingress exposure (TLS, wildcard hosts, ingress class, backend resolution)
      operationId: analyzeIngressExposure
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Ingress exposure bundle (each Ingress with hosts/TLS/backends plus existing Services for resolution); omit to auto-collect from the cluster
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/optimization/posture/cluster:
    get:
      tags: [optimization]
      summary: Aggregated cluster governance posture across all M61-M78 analyzers
      operationId: getPostureReport
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cluster_id, in: query, required: true, schema: { type: integer } }
        - { name: target_version, in: query, description: Optional Kubernetes target version for the deprecated-API check, schema: { type: string } }
      responses:
        '200':
          description: Aggregated posture report (risk-sorted findings + per-domain rollups)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureReport' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/fleet/health:
    get: { tags: [fleet], summary: Compare bounded health samples across enabled clusters, operationId: getFleetHealth, security: [{ bearerAuth: [] }], parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }], responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } } }
  /api/v1/fleet/resources/search:
    get:
      tags: [fleet]
      summary: Search fixed resource kinds across a bounded enabled-cluster set
      operationId: searchFleetResources
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 63 } }
        - { name: kinds, in: query, description: Comma-separated subset of pods deployments services ingresses, schema: { type: string } }
        - { name: cluster_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Bounded global search response, content: { application/json: { schema: { $ref: '#/components/schemas/GlobalSearchResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/fleet/resources/search/filters:
    get:
      tags: [fleet]
      summary: List the current user's saved global-search filters
      operationId: listGlobalSearchFilters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User-owned saved filters and the fixed per-user limit, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [fleet]
      summary: Save the current bounded global-search query for the current user
      operationId: createGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterCreate' } } } }
      responses:
        '201': { description: Saved filter, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/fleet/resources/search/filters/{filter_id}:
    patch:
      tags: [fleet]
      summary: Rename a saved filter or overwrite it with a complete bounded query
      operationId: updateGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FilterID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilterUpdate' } } } }
      responses:
        '200': { description: Updated saved filter, content: { application/json: { schema: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [fleet]
      summary: Delete one of the current user's saved global-search filters
      operationId: deleteGlobalSearchFilter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FilterID' }]
      responses:
        '204': { description: Saved filter deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      tags: [health]
      summary: Prometheus request metrics
      description: Internal scrape endpoint. Restrict it to a trusted monitoring network; it has no user authentication.
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /api/v1/health/live:
    get: { tags: [health], summary: Process liveness, operationId: healthLive, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/health/ready:
    get: { tags: [health], summary: Dependency readiness, operationId: healthReady, responses: { '200': { $ref: '#/components/responses/Ok' }, '503': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/login:
    post: { tags: [auth], summary: Create access and refresh session, operationId: login, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }, responses: { '200': { $ref: '#/components/responses/Login' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/refresh:
    post: { tags: [auth], summary: Rotate refresh cookie and issue access token, operationId: refresh, security: [{ refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Login' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/logout:
    post: { tags: [auth], summary: Revoke current refresh session, operationId: logout, security: [{ refreshCookie: [] }], responses: { '204': { description: Revoked } } }
  /api/v1/auth/me:
    get: { tags: [auth], summary: Current user, operationId: me, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/User' }, '401': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/password-change:
    post: { tags: [auth], summary: Change own password, operationId: changePassword, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }, responses: { '204': { description: Password changed and sessions revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/sessions:
    get: { tags: [auth], summary: List own refresh sessions, operationId: sessions, security: [{ bearerAuth: [], refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/auth/sessions/{session_id}:
    delete: { tags: [auth], summary: Revoke another own session, operationId: revokeSession, security: [{ bearerAuth: [], refreshCookie: [] }], parameters: [{ $ref: '#/components/parameters/SessionID' }], responses: { '204': { description: Revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/sessions/revoke-others:
    post: { tags: [auth], summary: Revoke all other sessions, operationId: revokeOtherSessions, security: [{ bearerAuth: [], refreshCookie: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/auth/oidc/login:
    get: { tags: [auth], summary: Redirect to the OIDC provider authorization endpoint, operationId: oidcLogin, responses: { '302': { description: Redirect to provider } } }
  /api/v1/auth/oidc/callback:
    get: { tags: [auth], summary: Complete the OIDC Authorization Code + PKCE flow and issue a local session, operationId: oidcCallback, parameters: [{ name: code, in: query, required: true, schema: { type: string } }, { name: state, in: query, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Login' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/oidc/logout:
    post: { tags: [auth], summary: Build the provider end_session endpoint URL for RP-initiated logout, operationId: oidcLogout, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/users:
    get: { tags: [users], summary: List users, operationId: listUsers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [users], summary: Create user, operationId: createUser, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserWrite' } } } }, responses: { '201': { $ref: '#/components/responses/User' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/assignable:
    get: { tags: [users], summary: List assignable operators, operationId: assignableUsers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/users/{user_id}:
    patch: { tags: [users], summary: Update user status, display name or roles, operationId: updateUser, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }, responses: { '200': { $ref: '#/components/responses/User' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/password-reset:
    post: { tags: [users], summary: Reset another user's password, operationId: resetPassword, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }, responses: { '204': { description: Reset and sessions revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/cluster-grants:
    get: { tags: [access-grants], summary: List cluster access grants for a user, operationId: listClusterGrants, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [access-grants], summary: Grant a user access to a cluster, operationId: createClusterGrant, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterGrantCreate' } } } }, responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/cluster-grants/{cluster_id}:
    delete: { tags: [access-grants], summary: Revoke a user's cluster access grant, operationId: deleteClusterGrant, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }, { $ref: '#/components/parameters/ClusterID' }], responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/namespace-grants:
    get: { tags: [access-grants], summary: List namespace access grants for a user, operationId: listNamespaceGrants, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [access-grants], summary: Grant a user access to a namespace in a cluster, operationId: createNamespaceGrant, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NamespaceGrantCreate' } } } }, responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/users/{user_id}/namespace-grants/{cluster_id}/{namespace}:
    delete: { tags: [access-grants], summary: Revoke a user's namespace access grant, operationId: deleteNamespaceGrant, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/UserID' }, { $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/Error' } } }
  /api/v1/auth/me/grants:
    get: { tags: [access-grants], summary: List the current user's cluster and namespace grants, operationId: listMyGrants, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters:
    get: { tags: [clusters], summary: List registered clusters, operationId: listClusters, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    post: { tags: [clusters], summary: Register encrypted kubeconfig, operationId: createCluster, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterWrite' } } } }, responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}:
    get: { tags: [clusters], summary: Cluster detail, operationId: getCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
    patch: { tags: [clusters], summary: Enable or disable cluster, operationId: updateCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '204': { description: Updated } } }
    delete: { tags: [clusters], summary: Delete cluster and credential, operationId: deleteCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '204': { description: Deleted } } }
  /api/v1/clusters/{cluster_id}/credentials:
    put: { tags: [clusters], summary: Atomically replace encrypted kubeconfig, operationId: rotateClusterCredentials, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRotationRequest' } } } }, responses: { '204': { description: Replaced and probe state reset }, '400': { $ref: '#/components/responses/Error' } } }
  /api/v1/clusters/{cluster_id}/probe:
    post: { tags: [clusters], summary: Probe cluster connectivity, operationId: probeCluster, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ClusterID' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/clusters/{cluster_id}/api-resources:
    get:
      tags: [kubernetes]
      summary: Discover API resources (fixed whitelist + dynamic CRD discovery preview)
      description: Returns the union of a fixed operator-curated GVR whitelist (always present) and dynamically discovered resources on the cluster. Read-only GVR metadata; no resource instances. This is the M47 preview of M49's full CRD browsing.
      operationId: listClusterAPIResources
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      responses:
        '200':
          description: API resource catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIResourceList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/custom-resources/{group}/{version}/{resource}:
    get:
      tags: [kubernetes]
      summary: List bounded, redacted custom resource instances (read-only CRD browsing)
      description: Returns a bounded, redacted projection of instances for a whitelisted CRD GVR. Only GVRs in the server-owned static whitelist (Velero, Prometheus operator, Flux helm/source, cert-manager) are browsable; a non-whitelisted GVR returns 404 (anti-leakage — indistinguishable from a missing resource). Namespaced CRDs fan out across the caller's authorized namespace scope (M35) and honor the ?workspace_id visibility filter (M47); cluster-scoped CRDs are listed cluster-wide. Sensitive fields (password, secret, token, ...) are redacted to "<redacted>". Read-only — no create/update/delete surface is exposed.
      operationId: listCustomResources
      security: [{ bearerAuth: [] }]
      parameters:

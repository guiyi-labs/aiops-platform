      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateFederationStatusRequest' } } } }
      responses:
        '200': { description: Updated cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}/events:
    get:
      tags: [federation]
      summary: Recent federation events for one cluster (newest first)
      operationId: listFederationClusterEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Federation events for the cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationEventList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/clusters/{cluster_id}/monitoring/dashboard/{template}:
    get:
      tags: [monitoring]
      summary: Single-cluster fixed monitoring dashboard
      description: Returns the fixed dashboard template panels for the cluster. The frontend uses the panel descriptors to drive GET /metrics/history calls. Clients cannot inject PromQL; only the four fixed templates (node_overview, workload_overview, pod_overview, workspace_overview) are accepted. The dashboard time window is bounded to 24h. See ADR 0065.
      operationId: getClusterMonitoringDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: template, in: path, required: true, schema: { type: string, enum: [node_overview, workload_overview, pod_overview, workspace_overview] } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 253 }, description: Optional namespace filter for pod/workload templates }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Fixed dashboard template, content: { application/json: { schema: { $ref: '#/components/schemas/ClusterDashboardResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Monitoring service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/workspaces/{workspace_id}/monitoring/dashboard:
    get:
      tags: [monitoring, workspace]
      summary: Workspace-level cross-cluster monitoring dashboard
      description: Returns the fixed workspace_overview template plus the workspace's cross-cluster (cluster, namespaces) topology. The frontend fans out per-cluster /metrics/history calls using the topology. The fan-out is bounded (20 clusters max). workspace_viewer authorization is enforced via workspace.Service.ListMemberships (404 > 403 anti-leakage). See ADR 0065.
      operationId: getWorkspaceMonitoringDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Workspace cross-cluster dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDashboardResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Monitoring service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/clusters/{cluster_id}/logs/query:
    post:
      tags: [monitoring]
      summary: Bounded Loki log query (cluster-scoped)
      description: Queries historical logs via the configured Loki provider. Clients cannot inject LogQL. The namespace arrives in the body and is re-checked against the M35 resolved namespace scope (anti-leakage 404). Range hard-stops at 7 days. Provider-side failures surface as an unavailable result state. See ADR 0065.
      operationId: queryClusterLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitoringLogQuery' }
      responses:
        '200': { description: Normalized historical log result, content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityLogResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { description: Log provider unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }


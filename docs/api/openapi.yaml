  /api/v1/federation/overview:
    get:
      tags: [federation]
      summary: Federation topology and health summary
      description: Returns the host cluster, member clusters, standalone clusters, and aggregated health counts. Pure SQL aggregation — no live probing. See ADR 0063.
      operationId: getFederationOverview
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Federation overview, content: { application/json: { schema: { $ref: '#/components/schemas/FederationOverview' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/events:
    get:
      tags: [federation]
      summary: Recent federation events (bounded, newest first)
      operationId: listFederationEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Federation events, content: { application/json: { schema: { $ref: '#/components/schemas/FederationEventList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/resources/summary:
    get:
      tags: [federation]
      summary: Cross-cluster resource count by GVR (fixed whitelist)
      description: Aggregates resource counts across visible clusters for each GVR in the operator-curated whitelist. Bounded fan-out (20 clusters, 4s per-cluster timeout). Missing/unreachable clusters contribute zero counts with an error code. See ADR 0063.
      operationId: getFederationResourceSummary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Resource summary, content: { application/json: { schema: { $ref: '#/components/schemas/FederationResourceSummary' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/register:
    post:
      tags: [federation]
      summary: Register an existing cluster as host or member (operations_admin+)
      description: "Promotes an existing cluster (already in the clusters table) to a federation host or member. Registration does NOT provision a new cluster — the kubeconfig-direct-connection model is preserved. The single-host invariant is enforced: at most one cluster may be the host. See ADR 0063."
      operationId: registerFederationCluster
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterFederationClusterRequest' } } } }
      responses:
        '200': { description: Registered cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { description: Federation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/federation/clusters/{cluster_id}:
    delete:
      tags: [federation]
      summary: Deregister a cluster from the federation (operations_admin+)
      description: "Soft-delete: sets cluster_role back to standalone and federation_status to registered. The cluster row and its kubeconfig are preserved. The host cluster cannot be deregistered directly; it must first be demoted via /demote. See ADR 0063."
      operationId: deregisterFederationCluster
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
      responses:
        '200': { description: Deregistered cluster, content: { application/json: { schema: { $ref: '#/components/schemas/FederationCluster' } } } }

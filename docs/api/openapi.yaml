        - { name: cluster_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 253 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, previewed, approved, executing, succeeded, failed, expired, cancelled, verified] } }
        - { name: runbook_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Paginated action plans, content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanListResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { description: Automation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [automation]
      summary: Create a draft action plan from a recommended runbook
      operationId: createAutomationPlan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionPlanRequest' }
      responses:
        '201': { description: Draft action plan created, content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Not authorized to create action plans, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Correlation case not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Runbook not eligible or operation no change, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Automation service disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/aiops/automation/plans/{plan_id}:
    get:
      tags: [automation]
      summary: Get one action plan by ID
      operationId: getAutomationPlan
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Action plan, content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { description: Automation service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/aiops/automation/plans/{plan_id}/preview:
    post:
      tags: [automation]
      summary: Evaluate deterministic policy gates and transition a draft plan to previewed
      operationId: previewAutomationPlan
      description: Evaluates the full policy gate set (UID/RV recheck, scope, PDB/blast radius, SLO burn, freeze window, concurrent plans, attempt cap, rollback point). The confirmation token returned must be supplied at execute time.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Previewed action plan with policy gate results and confirmation token, content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Not authorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Plan not in draft status or one or more policy gates failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Automation service disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/aiops/automation/plans/{plan_id}/approve:
    post:
      tags: [automation]
      summary: Record human approval and transition a previewed plan to approved
      operationId: approveAutomationPlan
      description: For four-eyes plans (deployment.rollback, deployment.image_update), the approver must differ from the requester; the requester cannot self-approve.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveActionPlanRequest' }
      responses:
        '200': { description: Approved action plan, content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Self-approval forbidden for four-eyes plans, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Plan not in previewed status, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Automation service disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/aiops/automation/plans/{plan_id}/execute:
    post:
      tags: [automation]
      summary: Recheck policy gates, take an idempotent claim, apply the Kubernetes patch
      operationId: executeAutomationPlan
      description: Two workers and replay produce one business side effect. The claim is keyed by (plan_id, idempotency_key, confirmation_token_hash). The Idempotency-Key header (8..128 chars) is required.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteActionPlanRequest' }
      responses:
        '200': { description: Executed action plan (succeeded or failed), content: { application/json: { schema: { $ref: '#/components/schemas/ActionPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Confirmation token invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Plan not approved, in progress, already used, target changed, or policy gate failed at recheck, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Plan expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: Kubernetes API rejected or failed the automation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Automation service disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/aiops/automation/plans/{plan_id}/cancel:
    post:
      tags: [automation]
      summary: Transition a non-terminal action plan to cancelled
      operationId: cancelAutomationPlan

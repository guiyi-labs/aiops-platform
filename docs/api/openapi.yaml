    DiagnosisRequest: { type: object, required: [resource_kind, name], properties: { resource_kind: { type: string, enum: [Pod, Service, Node, Deployment, Ingress, PersistentVolumeClaim, HorizontalPodAutoscaler] }, namespace: { type: string, description: Required for namespaced resources; empty for Node }, name: { type: string } } }
    IncidentCreateRequest: { type: object, required: [source_type, source_ref, cluster_id], properties: { source_type: { type: string, enum: [diagnosis, finding, alert, inspection, signal, correlation] }, source_ref: { type: string, description: diagnosis:<id> for diagnosis sources, alert:<id> for firing alert instances, inspection:<id> for inspection results, signal:<id> for normalized signal occurrences, otherwise a stable finding identity }, template_id: { type: string, maxLength: 64, description: Optional response template identifier }, cluster_id: { type: integer, format: int64 }, title: { type: string, maxLength: 500 }, severity: { type: string, enum: [info, warning, high, critical] }, summary: { type: string, maxLength: 4000 }, observed_at: { type: string, format: date-time }, resource: { $ref: '#/components/schemas/IncidentResource' } } }
    IncidentSeverityTarget: { type: object, required: [severity, target_minutes], properties: { severity: { type: string, enum: [info, warning, high, critical] }, target_minutes: { type: integer, minimum: 1 } } }
    IncidentResponseTemplate: { type: object, required: [id, name, description, source_types, default_title, default_severity, default_summary, steps], properties: { id: { type: string }, name: { type: string }, description: { type: string }, source_types: { type: array, items: { type: string, enum: [diagnosis, finding, alert, inspection, signal, correlation] } }, default_title: { type: string }, default_severity: { type: string, enum: [info, warning, high, critical] }, default_summary: { type: string }, steps: { type: array, items: { type: string } } } }
    IncidentResponseCatalog: { type: object, required: [templates, severity_matrix], properties: { templates: { type: array, items: { $ref: '#/components/schemas/IncidentResponseTemplate' } }, severity_matrix: { type: array, items: { $ref: '#/components/schemas/IncidentSeverityTarget' } } } }
    IncidentMetrics:

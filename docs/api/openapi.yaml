        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertInstance:
      type: object
      required: [id, rule_id, diagnosis_id, state, first_fired_at, last_fired_at, latest_evidence_anchor, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        diagnosis_id: { type: integer, format: int64 }
        state: { type: string, enum: [firing, resolved] }
        first_fired_at: { type: string, format: date-time }
        last_fired_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        latest_evidence_anchor: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertOverviewGroup:
      type: object
      additionalProperties: false
      required: [rule_id, display_name, resource_kind, resource_name, metric_name, firing_count, resolved_count, first_fired_at, last_fired_at]
      properties:
        rule_id: { type: integer, format: int64 }
        display_name: { type: string }
        resource_kind: { type: string }
        resource_name: { type: string }
        metric_name: { type: string }
        firing_count: { type: integer, description: Firing instances folded into this group }
        resolved_count: { type: integer, description: Resolved instances folded into this group }
        first_fired_at: { type: string, format: date-time }
        last_fired_at: { type: string, format: date-time }
        related_case_ids:
          type: array
          items: { type: integer, format: int64 }
          description: Active correlation cases covering the same resource
    AlertOverviewResponse:
      type: object
      additionalProperties: false
      required: [scope, observed_at, window_minutes, groups_total, groups, total_firing, total_resolved, fail_closed]
      properties:
        scope: { type: string }
        observed_at: { type: string, format: date-time }
        window_minutes: { type: integer }
        groups_total: { type: integer }
        groups:
          type: array
          items: { $ref: '#/components/schemas/AlertOverviewGroup' }
        total_firing: { type: integer }
        total_resolved: { type: integer }
        fail_closed: { type: boolean, description: True when the window has no alerts (never treated as healthy) }
        empty_note: { type: string }
    ActorRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    CapabilityMetricsResult:
      type: object
      additionalProperties: false
      required: [template, schema_version, series, coverage, state, freshness]
      properties:
        template: { type: string, enum: [request_rate, error_rate, latency_p99, cpu_usage, memory_usage] }
        schema_version: { type: string, enum: ['1.0'] }
        series:
          type: array
          items: { $ref: '#/components/schemas/CapabilityMetricsSeries' }
        coverage: { $ref: '#/components/schemas/CapabilityMetricsCoverage' }
        state: { type: string, enum: [complete, partial, unavailable] }
        freshness: { type: string, format: date-time }
        error: { type: string, description: Sanitized, leak-free message populated only when state is unavailable or partial }
    CapabilityMetricsSeries:
      type: object
      additionalProperties: false
      required: [labels, points]
      properties:
        labels: { type: object, additionalProperties: { type: string } }
        points:
          type: array
          items: { $ref: '#/components/schemas/CapabilityMetricsPoint' }
    CapabilityMetricsPoint:
      type: object
      additionalProperties: false
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number }
    CapabilityMetricsCoverage:
      type: object
      additionalProperties: false
      required: [total_samples, expected_samples, missing_samples, source]
      properties:
        total_samples: { type: integer, minimum: 0 }
        expected_samples: { type: integer, minimum: 0 }
        missing_samples: { type: integer, minimum: 0 }
        source: { type: string, description: Provider identifier, e.g. prometheus }
    CapabilityLogQuery:
      type: object
      additionalProperties: false
      required: [cluster_id, namespace, start, end]
      properties:
        cluster_id: { type: integer, format: int64, minimum: 1 }
        namespace: { type: string, maxLength: 63 }
        pod: { type: string, maxLength: 253 }
        container: { type: string, maxLength: 253 }
        text_filter: { type: string, maxLength: 256 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        direction: { type: string, enum: [forward, backward], default: forward }
        limit: { type: integer, minimum: 0, maximum: 500, default: 0, description: 'Maximum entries to return; 0 means provider default' }
    CapabilityLogResult:
      type: object
      additionalProperties: false
      required: [entries, state, total_returned]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/CapabilityLogEntry' }
        state: { type: string, enum: [complete, partial, unavailable, truncated] }
        total_returned: { type: integer, minimum: 0 }
        error: { type: string, description: Sanitized, leak-free message populated only when state is unavailable, partial or truncated }
    CapabilityLogEntry:
      type: object
      additionalProperties: false
      required: [timestamp, namespace, pod, container, stream, line]
      properties:
        timestamp: { type: string, format: date-time }
        namespace: { type: string }
        pod: { type: string }
        container: { type: string }
        stream: { type: string, enum: [stdout, stderr] }
        line: { type: string }
    ProviderInfo:
      type: object
      additionalProperties: false
      required: [name, description, kind, dependencies, cluster_roles, configured, state]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          maxLength: 64
          description: Compile-time stable provider identifier. DNS-1123 style lowercase slug used as URL path segment.
        description:
          type: string
          description: One-line human-readable description for the provider list UI.
        version:
          type: string
          description: Provider's own semantic version; empty string means the version is inherited from platform buildinfo.
        kind:
          type: string
          enum: [capability, signal, mesh, inspection, gitops, backup, federation, appcatalog, copyops, ai, misc]
          description: UI grouping tag for the provider list (capability / signal / mesh / inspection / gitops / backup / federation / appcatalog / copyops / ai / misc).
        dependencies:
          type: array
          items: { type: string }
          description: Names of providers that must be successfully started before this one and whose health state influences the aggregate.
        cluster_roles:
          type: array
          items: { type: string, enum: [host, member, standalone] }
          description: Cluster roles on which this provider is eligible to activate. Empty array means no role gate (runs on any topology).
        configured:
          type: boolean
          description: True when the provider has valid runtime configuration. False means the provider is structurally disabled (registry reports state=disabled).
        state:
          type: string
          enum: [disabled, enabled, starting, stopping, degraded, unhealthy]
          description: Runtime lifecycle state. Disabled providers never transition out of disabled regardless of probes.
        health_reason:
          type: string
          description: Sanitized, length-bounded reason populated only when state is degraded or unhealthy.
        started_at:
          type: string
          format: date-time
          description: UTC timestamp of the most recent successful Start. Omitted when the provider is disabled or has not started.
        last_check:
          type: string
          format: date-time
          description: UTC timestamp of the most recent health probe completion. Omitted when the provider has no HealthChecker or is disabled.
    AlertReceiverView:
      type: object
      additionalProperties: false
      required: [id, name, url_masked, creator_id]
      properties:
        id: { type: integer, format: int64 }

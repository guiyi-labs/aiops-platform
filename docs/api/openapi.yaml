    EventStreamMessage:
      type: object
      description: "One SSE message on the events/stream endpoint. The event field names the SSE event type (hello, event, stream-closed); the data field carries the JSON payload described by the matching schema below."
      properties:
        event:
          type: string
          enum: [hello, event, stream-closed]

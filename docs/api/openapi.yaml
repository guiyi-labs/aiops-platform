    get: { tags: [ai], summary: AI feedback quality summary, operationId: aiQuality, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/ai/explanations/{explanation_id}/feedback:
    post: { tags: [ai], summary: Rate one AI explanation, operationId: aiFeedback, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ExplanationID' }], responses: { '204': { description: Recorded }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/notification-deliveries:
    get: { tags: [notifications], summary: List diagnosis notification deliveries, operationId: listNotificationDeliveries, security: [{ bearerAuth: [] }], parameters: [{ name: diagnosis_id, in: query, schema: { type: integer, format: int64 } }, { name: event_type, in: query, schema: { type: string, enum: [diagnosis.created, diagnosis.status_changed, diagnosis.assigned] } }, { name: status, in: query, schema: { type: string, enum: [pending, delivering, delivered, dead] } }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/notification-deliveries/{delivery_id}/retry:
    post: { tags: [notifications], summary: Retry a dead diagnosis notification, operationId: retryNotificationDelivery, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/DeliveryID' }], responses: { '202': { description: Retry queued }, '409': { $ref: '#/components/responses/Error' } } }
  /api/v1/audit-logs:
    get: { tags: [audit], summary: Query audit logs, operationId: listAuditLogs, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/audit-logs/export:
    get: { tags: [audit], summary: Export safe UTF-8 CSV, operationId: exportAuditLogs, security: [{ bearerAuth: [] }], responses: { '200': { description: CSV export, content: { text/csv: { schema: { type: string } } } } } }
  /api/v1/clusters/{cluster_id}/alert-rules:
    get:
      tags: [alert-rules]
      summary: List alert rules for a cluster
      operationId: listAlertRules
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of alert rules, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AlertRule' } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [alert-rules]
      summary: Create an alert rule
      description: Creates a fixed alert rule for one exact Node CPU or memory series. Maximum 20 non-deleted rules per cluster. Evaluation fields are immutable after creation.
      operationId: createAlertRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleCreate' } } } }
      responses:
        '201': { description: Created alert rule, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/alert-rules/{rule_id}:
    get:
      tags: [alert-rules]
      summary: Get an alert rule
      operationId: getAlertRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/RuleID' }]
      responses:
        '200': { description: Alert rule, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [alert-rules]
      summary: Update alert rule display name or enabled state
      description: Only display_name and enabled may be patched. Evaluation fields are immutable.
      operationId: patchAlertRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/RuleID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRulePatch' } } } }
      responses:
        '200': { description: Updated alert rule, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [alert-rules]
      summary: Soft-delete an alert rule
      description: Soft deletes the rule. Fails with UNRESOLVED_ALERT if an active firing instance exists.
      operationId: deleteAlertRule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/RuleID' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/alerts:
    get:
      tags: [alerts]
      summary: List alert instances for a cluster
      operationId: listAlertInstances
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ClusterID' }
        - { name: state, in: query, schema: { type: string, enum: [firing, resolved] } }
        - { name: rule_id, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: List of alert instances, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AlertInstance' } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/alerts/{alert_id}:
    get:
      tags: [alerts]
      summary: Get an alert instance
      operationId: getAlertInstance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }, { $ref: '#/components/parameters/AlertID' }]
      responses:
        '200': { description: Alert instance, content: { application/json: { schema: { $ref: '#/components/schemas/AlertInstance' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/namespace-postures:
    get:
      tags: [namespace-posture]
      summary: List namespace posture summaries for a cluster
      operationId: listNamespacePostures
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of namespace posture summaries, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/namespace-postures/{namespace}:
    get:
      tags: [namespace-posture]
      summary: Get a namespace posture summary
      operationId: getNamespacePosture
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }, { name: namespace, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Namespace posture summary, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/backup-plans:
    get:
      tags: [backup]
      summary: List backup plans for a cluster
      operationId: listBackupPlans
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of backup plans, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/backup-plans/preview:
    post:
      tags: [backup]
      summary: Preview a Velero backup plan
      description: Runs preflight checks (Velero installed, BSL exists, name available, server-side dry-run) and persists an awaiting-confirmation plan with a one-time confirmation token.
      operationId: previewBackupPlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Backup plan awaiting confirmation, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/backup-plans/{plan_id}/execute:
    post:
      tags: [backup]
      summary: Execute a backup plan
      description: Claims the plan with a one-time confirmation token and an Idempotency-Key header, then creates the Velero Backup CR. Same-key replay returns the same plan without re-mutating.
      operationId: executeBackupPlan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: plan_id, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string } } } } } }
      responses:
        '200': { description: Executed backup plan, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/maintenance-plans:
    get:
      tags: [maintenance]
      summary: List maintenance plans for a cluster
      operationId: listMaintenancePlans
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of maintenance plans, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/maintenance-plans/preview:
    post:
      tags: [maintenance]
      summary: Preview a Node maintenance plan
      description: Runs preconditions (worker Node, cordon/uncordon/drain state checks), classifies resident Pods into retained/evictable/blocking, performs a server-side dry-run Node patch (cordon/uncordon), and persists an awaiting-confirmation plan with a one-time confirmation token.
      operationId: previewMaintenancePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Maintenance plan awaiting confirmation, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/maintenance-plans/{plan_id}/execute:
    post:
      tags: [maintenance]
      summary: Execute a maintenance plan
      description: Claims the plan with a one-time confirmation token and an Idempotency-Key header, then performs cordon/uncordon patch or bounded PDB-aware eviction. Force deletion, PDB bypass, emptyDir deletion, arbitrary Pod delete, and auto-uncordon after failed drain are prohibited.
      operationId: executeMaintenancePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: plan_id, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string } } } } } }
      responses:
        '200': { description: Executed maintenance plan, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/restore-plans:
    get:
      tags: [restore]
      summary: List restore rehearsal plans for a cluster
      operationId: listRestorePlans
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      responses:
        '200': { description: List of restore rehearsal plans, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clusters/{cluster_id}/restore-plans/preview:
    post:
      tags: [restore]
      summary: Preview an isolated workload restore rehearsal plan
      description: Runs preflight checks (Velero installed, source Backup Completed and M28-compatible single-namespace scope, destination Namespace absent, no active plan for the same source, Restore name available) and server-side dry-runs of the quarantine controls (default-deny NetworkPolicy + zero-Pod ResourceQuota) and Restore CR. Persists an awaiting-confirmation plan with a one-time confirmation token.
      operationId: previewRestorePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ClusterID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source_backup_name, source_backup_namespace], properties: { source_backup_name: { type: string }, source_backup_namespace: { type: string } } } } } }
      responses:
        '201': { description: Restore rehearsal plan awaiting confirmation, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/restore-plans/{plan_id}/execute:
    post:
      tags: [restore]
      summary: Execute an isolated workload restore rehearsal plan
      description: Claims the plan with a one-time confirmation token and an Idempotency-Key header, then creates the quarantine Namespace, NetworkPolicy, ResourceQuota, and Velero Restore CR; polls until terminal; projects restored items by allowlisted kinds. In-place restore, PV restore, cross-cluster restore, cutover/rollback, operator-supplied destination names, and arbitrary include/exclude lists are prohibited.
      operationId: executeRestorePlan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: plan_id, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string } } } } } }
      responses:
        '200': { description: Executed restore rehearsal plan, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: aiops_refresh }
  parameters:
    ClusterID: { name: cluster_id, in: path, required: true, schema: { type: integer, format: int64 } }
    UserID: { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } }
    SessionID: { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
    DiagnosisID: { name: diagnosis_id, in: path, required: true, schema: { type: integer, format: int64 } }
    ExplanationID: { name: explanation_id, in: path, required: true, schema: { type: integer, format: int64 } }
    DeliveryID: { name: delivery_id, in: path, required: true, schema: { type: integer, format: int64 } }
    RemediationID: { name: remediation_id, in: path, required: true, schema: { type: string, format: uuid } }
    PromotionID: { name: promotion_id, in: path, required: true, schema: { type: string, format: uuid } }
    FilterID: { name: filter_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    RuleID: { name: rule_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    AlertID: { name: alert_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    Namespace: { name: namespace, in: path, required: true, schema: { type: string } }
    Name: { name: name, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Ok: { description: Successful JSON response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    User: { description: User response without password material, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    Login: { description: Login or refresh response, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
    Error: { description: Structured error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    MetricHistoryResponse:
      type: object
      additionalProperties: false
      required: [series, from, to, points, coverage, limits, truncated]
      properties:
        series: { $ref: '#/components/schemas/MetricHistorySeries' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        points: { type: array, maxItems: 1440, items: { $ref: '#/components/schemas/MetricHistoryPoint' } }
        coverage: { $ref: '#/components/schemas/MetricHistoryCoverage' }
        limits: { $ref: '#/components/schemas/MetricHistoryLimits' }
        truncated: { type: boolean }
    MetricHistorySeries:
      type: object
      additionalProperties: false
      required: [cluster_id, resource_kind, resource_name, metric_name, unit]
      properties:
        cluster_id: { type: integer, format: int64, minimum: 1 }
        resource_kind: { type: string, enum: [Node, Pod] }
        resource_namespace: { type: string, maxLength: 63 }
        resource_name: { type: string, minLength: 1, maxLength: 253 }
        container_name: { type: string, maxLength: 253 }
        metric_name: { type: string, enum: [cpu, memory] }
        unit: { type: string, enum: [nanocores, bytes] }
    MetricHistoryPoint:
      type: object
      additionalProperties: false
      required: [value, source_timestamp, window_milliseconds, collected_at]
      properties:
        value: { type: integer, format: int64, minimum: 0 }
        source_timestamp: { type: string, format: date-time }
        window_milliseconds: { type: integer, minimum: 1000, maximum: 3600000 }
        collected_at: { type: string, format: date-time }
    MetricHistoryCoverage:
      type: object
      additionalProperties: false
      required: [collections, succeeded, partial, unavailable, timed_out, failed, points, missing]
      properties:
        collections: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        partial: { type: integer, minimum: 0 }
        unavailable: { type: integer, minimum: 0 }
        timed_out: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
    MetricHistoryLimits:
      type: object
      additionalProperties: false
      required: [max_window_seconds, max_points]
      properties:
        max_window_seconds: { type: integer, enum: [86400] }
        max_points: { type: integer, enum: [1440] }
    MetricHistoryEvaluationResponse:
      type: object
      additionalProperties: false
      required: [series, from, to, coverage, state, operator, threshold, for_seconds, minimum_points, points_evaluated, breaching_points, observed_span_seconds, sustained_windows, latest_firing_window]
      properties:
        series: { $ref: '#/components/schemas/MetricHistorySeries' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/MetricHistoryCoverage' }
        state: { type: string, enum: [firing, normal, insufficient_data] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64, minimum: 0 }
        for_seconds: { type: integer, minimum: 60, maximum: 86400 }
        minimum_points: { type: integer, minimum: 2, maximum: 1440 }
        points_evaluated: { type: integer, minimum: 0, maximum: 1440 }
        breaching_points: { type: integer, minimum: 0, maximum: 1440 }
        observed_span_seconds: { type: integer, format: int64, minimum: 0, maximum: 86400 }
        sustained_windows:
          type: array
          description: All detected sustained breach windows across the full series
          items: { $ref: '#/components/schemas/SustainedWindow' }
        latest_firing_window:
          $ref: '#/components/schemas/SustainedWindow'
          nullable: true
    SustainedWindow:
      type: object
      additionalProperties: false
      required: [start_collected_at, end_collected_at, breaching_points, span_seconds]
      properties:
        start_collected_at: { type: string, format: date-time }
        end_collected_at: { type: string, format: date-time }
        breaching_points: { type: integer, minimum: 1 }
        span_seconds: { type: integer, format: int64, minimum: 0 }
    SavedGlobalSearchFilterCreate:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        query: { type: string, minLength: 2, maxLength: 64 }
        namespace: { type: string, maxLength: 63, default: '' }
        kinds: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, description: Omission selects all four supported kinds, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
    SavedGlobalSearchFilterUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Name may be changed alone. Query, namespace and kinds must be supplied together when overwriting the query.
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        query: { type: string, minLength: 2, maxLength: 64 }
        namespace: { type: string, maxLength: 63 }
        kinds: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
    SavedGlobalSearchFilter:
      type: object
      required: [id, name, query, kinds, schema_version, compatible, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        query: { type: string }
        namespace: { type: string }
        kinds: { type: array, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
        schema_version: { type: integer }
        compatible: { type: boolean }
        incompatibility_code: { type: string, enum: [SCHEMA_VERSION, QUERY_SHAPE] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedGlobalSearchFilterList:
      type: object
      required: [items, total, limit]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SavedGlobalSearchFilter' } }
        total: { type: integer, minimum: 0, maximum: 20 }
        limit: { type: integer, enum: [20] }
    GlobalSearchResponse:
      type: object
      required: [query, kinds, items, total, remaining, clusters_total, clusters_searched, clusters_remaining, complete, failures, checked_at, limits]
      properties:
        query: { type: string }
        namespace: { type: string }
        kinds: { type: array, items: { type: string, enum: [Pod, Deployment, Service, Ingress] } }
        items: { type: array, items: { $ref: '#/components/schemas/GlobalSearchItem' } }
        total: { type: integer, minimum: 0, description: Known matches in searched clusters and successful kind reads }
        remaining: { type: integer, minimum: 0, description: Known matches omitted by the result limit }
        clusters_total: { type: integer, minimum: 0, description: Enabled clusters present when the query started }
        clusters_searched: { type: integer, minimum: 0 }
        clusters_remaining: { type: integer, minimum: 0, description: Enabled clusters omitted by cluster_limit }
        complete: { type: boolean }
        failures: { type: array, items: { $ref: '#/components/schemas/GlobalSearchFailure' } }
        checked_at: { type: string, format: date-time }
        limits:
          type: object
          required: [max_clusters, max_concurrent_clusters, per_cluster_timeout_ms, max_results, per_kind_limit]
          properties:
            max_clusters: { type: integer }
            max_concurrent_clusters: { type: integer }
            per_cluster_timeout_ms: { type: integer }
            max_results: { type: integer }
            per_kind_limit: { type: integer }
    GlobalSearchItem:
      type: object
      required: [cluster_id, cluster_name, kind, namespace, name, health, summary]
      properties:
        cluster_id: { type: integer, format: int64 }
        cluster_name: { type: string }
        kind: { type: string, enum: [Pod, Deployment, Service, Ingress] }
        namespace: { type: string }
        name: { type: string }
        health: { type: string, enum: [healthy, degraded, unknown] }
        summary: { type: string }
    GlobalSearchFailure:
      type: object
      required: [cluster_id, cluster_name, kind, code]
      properties:
        cluster_id: { type: integer, format: int64 }
        cluster_name: { type: string }
        kind: { type: string, enum: [Pod, Deployment, Service, Ingress] }
        code: { type: string, enum: [TIMEOUT, QUERY_FAILED] }
    Error: { type: object, required: [code, message, request_id], properties: { code: { type: string }, message: { type: string }, request_id: { type: string } } }
    LoginRequest: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } }
    LoginResponse: { type: object, required: [access_token, token_type, expires_in, user], properties: { access_token: { type: string }, token_type: { type: string, example: Bearer }, expires_in: { type: integer }, user: { $ref: '#/components/schemas/User' } } }
    User: { type: object, properties: { id: { type: integer }, username: { type: string }, display_name: { type: string }, roles: { type: array, items: { type: string } }, status: { type: string } } }
    UserWrite: { type: object, required: [username, display_name, password, roles], properties: { username: { type: string }, display_name: { type: string }, password: { type: string, format: password }, roles: { type: array, items: { type: string } } } }
    UserPatch: { type: object, properties: { display_name: { type: string }, status: { type: string, enum: [active, disabled] }, roles: { type: array, items: { type: string } } } }
    PasswordChangeRequest: { type: object, required: [current_password, new_password], properties: { current_password: { type: string, format: password }, new_password: { type: string, format: password } } }
    PasswordResetRequest: { type: object, required: [password], properties: { password: { type: string, format: password } } }
    ClusterWrite: { type: object, required: [name, kubeconfig], properties: { name: { type: string }, kubeconfig: { type: string, writeOnly: true } } }
    CredentialRotationRequest: { type: object, required: [kubeconfig], properties: { kubeconfig: { type: string, writeOnly: true } } }
    PodContainerInfo:
      type: object
      required: [name, ready, state, is_init, image]
      properties:
        name: { type: string }
        ready: { type: boolean }
        restart_count: { type: integer, format: int32 }
        state: { type: string, enum: [running, waiting, terminated] }
        is_init: { type: boolean }
        image: { type: string }
    PodLogLine:
      type: object
      required: [timestamp, message]
      properties:
        timestamp: { type: string, format: date-time }
        message: { type: string }
    PodContainerLog:
      type: object
      required: [container, lines, truncated]
      properties:
        container: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/PodLogLine' } }
        truncated: { type: boolean }
        truncation_reason: { type: string, enum: [body_limit, fetch_error] }
    PodLogsResponse:
      type: object
      required: [containers, previous]
      properties:
        containers: { type: array, items: { $ref: '#/components/schemas/PodContainerLog' } }
        previous: { type: boolean }
    DiagnosisRequest: { type: object, required: [resource_kind, name], properties: { resource_kind: { type: string, enum: [Pod, Service, Node, Deployment, Ingress, PersistentVolumeClaim, HorizontalPodAutoscaler] }, namespace: { type: string, description: Required for namespaced resources; empty for Node }, name: { type: string } } }
    DiagnoseNodeMetricsRequest:
      type: object
      additionalProperties: false
      required: [name, metric, operator, threshold, for_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 253, description: Node name }
        metric: { type: string, enum: [node_cpu, node_memory] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64, minimum: 0, description: 'nanocores for node_cpu, bytes for node_memory' }
        for_seconds: { type: integer, minimum: 60, maximum: 86400 }
        minimum_points: { type: integer, minimum: 2, maximum: 1440, default: 2 }
    RemediationPreviewRequest: { type: object, required: [action, target_name], properties: { action: { type: string, enum: [deployment.rollout_restart] }, target_name: { type: string, maxLength: 253 } } }
    ControlledOperationPreviewRequest:
      oneOf:
        - $ref: '#/components/schemas/DeploymentScaleOperation'
        - $ref: '#/components/schemas/CronJobScheduleOperation'
        - $ref: '#/components/schemas/DeploymentImageUpdateOperation'
        - $ref: '#/components/schemas/DeploymentRollbackOperation'
    DeploymentScaleOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, desired_replicas], properties: { action: { type: string, enum: [deployment.scale] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, desired_replicas: { type: integer, minimum: 0, maximum: 1000 } } }
    CronJobScheduleOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name], properties: { action: { type: string, enum: [cronjob.suspend, cronjob.resume] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 } } }
    DeploymentImageUpdateOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, container_name, desired_image], properties: { action: { type: string, enum: [deployment.image_update] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, container_name: { type: string, maxLength: 253 }, desired_image: { type: string, maxLength: 512 } } }
    DeploymentRollbackOperation: { type: object, additionalProperties: false, required: [action, namespace, target_name, rollback_revision], properties: { action: { type: string, enum: [deployment.rollback] }, namespace: { type: string, maxLength: 63 }, target_name: { type: string, maxLength: 253 }, rollback_revision: { type: integer, minimum: 1 } } }
    RemediationExecuteRequest: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string, writeOnly: true } } }
    PromotionPreviewRequest:
      type: object
      additionalProperties: false
      required: [source_cluster_id, destination_cluster_id, source_namespace, destination_namespace, bundle]
      properties:
        source_cluster_id: { type: integer, format: int64, minimum: 1 }
        destination_cluster_id: { type: integer, format: int64, minimum: 1 }
        source_namespace: { type: string, maxLength: 63 }
        destination_namespace: { type: string, maxLength: 63 }
        bundle:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/PromotionBundleItem' }
        dependency_mappings:
          type: array
          items: { $ref: '#/components/schemas/PromotionDependencyMapping' }
    PromotionBundleItem:
      type: object
      additionalProperties: false
      required: [kind, namespace, name]
      properties:
        kind: { type: string, enum: [Deployment, Service, Ingress] }
        namespace: { type: string, maxLength: 63 }
        name: { type: string, maxLength: 253 }
    PromotionDependencyMapping:
      type: object
      additionalProperties: false
      required: [kind, source_namespace, source_name, destination_namespace, destination_name]
      properties:
        kind: { type: string, enum: [ConfigMap, Secret] }
        source_namespace: { type: string, maxLength: 63 }
        source_name: { type: string, maxLength: 253 }
        destination_namespace: { type: string, maxLength: 63 }
        destination_name: { type: string, maxLength: 253 }
    PromotionExecuteRequest: { type: object, required: [confirmation_token], properties: { confirmation_token: { type: string, writeOnly: true } } }
    VeleroCapability:
      type: object
      additionalProperties: false
      required: [installed]
      properties:
        installed: { type: boolean, description: True when the velero.io/v1 API group is present on the cluster }
        version: { type: string, description: Velero API version string, e.g. v1 }
    VeleroBackup:
      type: object
      additionalProperties: false
      required: [name, namespace, phase, errors, warnings, created_at]
      properties:
        name: { type: string, maxLength: 253 }
        namespace: { type: string, maxLength: 63 }
        phase: { type: string, description: Velero backup phase, e.g. Completed, Failed, InProgress, PartiallyFailed }
        included_namespaces: { type: array, items: { type: string }, description: Bounded scope of the backup }
        storage_location: { type: string }
        ttl: { type: string, description: Backup retention duration as a Go duration string, e.g. 720h }
        expiration: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        failure_reason: { type: string, description: Populated only when phase is Failed }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    VeleroBackupList:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VeleroBackup' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    AlertRuleCreate:
      type: object
      additionalProperties: false
      required: [display_name, resource_kind, resource_name, metric_name, operator, threshold, for_seconds, minimum_points]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        resource_kind: { type: string, enum: [Node] }
        resource_name: { type: string, minLength: 1, maxLength: 253, description: Node name }
        metric_name: { type: string, enum: [cpu, memory] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64, minimum: 0, description: 'nanocores for cpu, bytes for memory' }
        for_seconds: { type: integer, minimum: 60, maximum: 21600 }
        minimum_points: { type: integer, minimum: 2, maximum: 360 }
    AlertRulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean }
    AlertRule:
      type: object
      required: [id, cluster_id, display_name, resource_kind, resource_name, metric_name, operator, threshold, for_seconds, minimum_points, enabled, deleted, last_evaluation_state, last_error_code, next_due_at, creator, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        cluster_id: { type: integer, format: int64 }
        display_name: { type: string }
        resource_kind: { type: string, enum: [Node] }
        resource_name: { type: string }
        metric_name: { type: string, enum: [cpu, memory] }
        operator: { type: string, enum: [gte, lte] }
        threshold: { type: integer, format: int64 }
        for_seconds: { type: integer }
        minimum_points: { type: integer }
        enabled: { type: boolean }
        deleted: { type: boolean }
        last_evaluation_state: { type: string, enum: ['', firing, normal, insufficient_data, error] }
        last_evaluation_at: { type: string, format: date-time, nullable: true }
        last_error_code: { type: string }
        next_due_at: { type: string, format: date-time }
        creator: { $ref: '#/components/schemas/ActorRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertInstance:
      type: object
      required: [id, rule_id, diagnosis_id, state, first_fired_at, last_fired_at, latest_evidence_anchor, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        diagnosis_id: { type: integer, format: int64 }
        state: { type: string, enum: [firing, resolved] }
        first_fired_at: { type: string, format: date-time }
        last_fired_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        latest_evidence_anchor: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActorRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

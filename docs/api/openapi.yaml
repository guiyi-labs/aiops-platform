        reason_code: { type: string, maxLength: 128 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActionCandidateList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionCandidate' }
        total: { type: integer }
    ActionCandidate:
      type: object
      additionalProperties: false
      required: [code, target, eligible, source_case_id]
      properties:
        code: { type: string, enum: [deployment.rollback, deployment.rollout_restart, deployment.scale, deployment.image_update, cronjob.suspend, cronjob.resume] }
        target: { $ref: '#/components/schemas/ResourceCitation' }
        eligible: { type: boolean }
        blocked_reasons:
          type: array
          items: { type: string }
        source_case_id: { type: integer, format: int64 }
        source_candidate_id: { type: integer, format: int64 }
    InvestigatorRunbookList:
      type: object
      additionalProperties: false
      required: [items, investigator_version]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvestigatorRunbook' }
        investigator_version: { type: string, maxLength: 16 }
    InvestigatorRunbook:
      type: object
      additionalProperties: false
      required: [runbook_id, action_code, title, steps]
      properties:
        runbook_id: { type: string, maxLength: 128 }
        action_code: { type: string, maxLength: 128, description: M19 controlled-operations code; empty for advisory-only runbooks }
        title: { type: string }
        steps:
          type: array
          items: { type: string }
    InvestigationListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Investigation' }
        total: { type: integer, format: int64 }
        truncated: { type: boolean }
    Investigation:
      type: object
      additionalProperties: false
      required: [id, case_id, investigation_key, investigator_version, actor, provider, model, status, summary, impact, hypotheses, citations, input_tokens, output_tokens, created_at]
      properties:
        id: { type: integer, format: int64 }
        case_id: { type: integer, format: int64 }
        investigation_key: { type: string, maxLength: 64, description: SHA256 over (case_id + investigator_version + prompt_hash) }
        investigator_version: { type: string, maxLength: 16 }
        actor: { $ref: '#/components/schemas/InvestigationActor' }
        provider: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        provider_response_id: { type: string, maxLength: 253 }
        status: { type: string, enum: [completed, failed, stale] }
        summary: { type: string, description: Empty when status is failed }
        impact: { type: string, description: Empty when status is failed }
        hypotheses:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/InvestigationHypothesis' }
        recommended_runbook_id: { type: string, maxLength: 128, description: Must be eligible per M42 Action Catalog at generation time }
        uncertainties:
          type: array
          maxItems: 16
          items: { type: string }
        citations:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/InvestigationCitation' }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        failure_reason: { type: string, maxLength: 253, description: Set when status is failed (provider_error, citation_rejected, etc.) }
        created_at: { type: string, format: date-time }
    InvestigationActor:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 253 }
    InvestigationHypothesis:
      type: object
      additionalProperties: false
      required: [claim, confidence, evidence_ids]
      properties:
        claim: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        evidence_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceRef' }
        disconfirming_evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
        next_checks:
          type: array
          maxItems: 8
          items: { type: string }
    InvestigationCitation:
      type: object
      additionalProperties: false
      required: [evidence_ref, claim]
      properties:
        evidence_ref: { $ref: '#/components/schemas/EvidenceRef' }
        claim: { type: string }
    AutomationRunbookList:
      type: object
      additionalProperties: false
      required: [items, automation_version]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AutomationRunbook' }
        automation_version: { type: string, maxLength: 16 }
    AutomationRunbook:
      type: object
      additionalProperties: false
      required: [runbook_id, action_code, title, steps]
      properties:
        runbook_id: { type: string, maxLength: 128 }
        action_code: { type: string, maxLength: 128, description: M19 controlled-operations code (e.g. deployment.rollback, deployment.rollout_restart) }
        title: { type: string }
        steps:
          type: array
          items: { type: string }
    CreateActionPlanRequest:
      type: object
      additionalProperties: false
      required: [case_id, runbook_id]
      properties:
        case_id: { type: integer, format: int64, minimum: 1, description: M42 correlation case ID }
        runbook_id: { type: string, maxLength: 128, description: Must exist in the executable runbook catalog and be eligible per the M42 Action Catalog }
        investigation_id: { type: integer, format: int64, minimum: 1, description: Optional M43 AI investigation linkage }
        action_candidate_id: { type: integer, format: int64, minimum: 1, description: Optional M42 change candidate linkage }
        operation_overrides: { $ref: '#/components/schemas/OperationParameters', description: Optional operator overrides for the materialized parameters (e.g. pick a different rollback revision) }
    ApproveActionPlanRequest:
      type: object
      additionalProperties: false
      properties:
        approver_id: { type: integer, format: int64, minimum: 1, description: Optional explicit approver ID; when empty the authenticated actor is the approver }
    ExecuteActionPlanRequest:
      type: object
      additionalProperties: false
      required: [confirmation_token]
      properties:
        confirmation_token: { type: string, description: Token returned by the preview endpoint; never persisted and never returned after execute }
    OperationParameters:
      type: object
      additionalProperties: false
      properties:
        desired_replicas: { type: integer, format: int32, minimum: 0 }
        desired_suspended: { type: boolean }
        container_name: { type: string, maxLength: 253 }
        before_image: { type: string, maxLength: 253, readOnly: true }
        desired_image: { type: string, maxLength: 253 }
        rollback_revision: { type: integer, format: int32, minimum: 1 }
    ActionPlanListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionPlanResponse' }
        total: { type: integer, format: int64 }
        truncated: { type: boolean }
    ActionPlanResponse:
      type: object
      additionalProperties: false
      required: [id, plan_key, automation_version, case_id, runbook_id, action_code, cluster_id, policy_gates, status, level, approval_type, expires_at, attempt_count, correlation_request_id, created_at, updated_at, target, requested_by, approver, parameters]
      properties:
        id: { type: string, format: uuid }
        plan_key: { type: string, maxLength: 64, description: SHA256 over (case_id + runbook_id + target_uid + automation_version) }
        automation_version: { type: string, maxLength: 16 }
        case_id: { type: integer, format: int64 }
        investigation_id: { type: integer, format: int64 }
        action_candidate_id: { type: integer, format: int64 }
        runbook_id: { type: string, maxLength: 128 }
        action_code: { type: string, maxLength: 128 }
        cluster_id: { type: integer, format: int64 }
        policy_gates:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/PolicyGate' }
        status: { type: string, enum: [draft, previewed, approved, executing, succeeded, failed, expired, cancelled, verified] }
        level: { type: string, enum: [L0, L1, L2, L3], description: L2 (human-confirmed) is the default ceiling }
        approval_type: { type: string, enum: [single, four_eyes] }
        approved_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        executed_at: { type: string, format: date-time }
        attempt_count: { type: integer, minimum: 0 }
        last_error: { type: string, description: Set when status is failed; sanitized Kubernetes error }
        verification_id: { type: integer, format: int64, description: Linked action verification ID after verification completes }
        correlation_request_id: { type: string, description: Shared across preview/approve/execute/verify for audit reconstruction }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        confirmation_token: { type: string, description: Returned only by the preview endpoint; never persisted and never returned after execute }
        target: { $ref: '#/components/schemas/AutomationTargetRef' }
        requested_by: { $ref: '#/components/schemas/AutomationActorRef' }
        approver: { $ref: '#/components/schemas/AutomationActorRef' }
        parameters: { $ref: '#/components/schemas/OperationParameters' }
        change: { $ref: '#/components/schemas/OperationChange', description: Preview diff for the plan's action }
    AutomationTargetRef:
      type: object
      additionalProperties: false
      required: [kind, namespace, name, uid, resource_version]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        uid: { type: string }
        resource_version: { type: string }
    AutomationActorRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 253 }
    PolicyGate:
      type: object
      additionalProperties: false
      required: [code, status, checked_at]
      properties:
        code: { type: string, enum: [uid_rv_recheck, scope, pdb_blast_radius, slo_burn, freeze_window, concurrent_plans, attempt_cap, rollback_point] }
        status: { type: string, enum: [passed, failed, skipped] }
        reason: { type: string, description: Set when status is failed }
        checked_at: { type: string, format: date-time }
        rechecked: { type: boolean, description: True when this gate was rechecked at execute time }
    OperationChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field: { type: string }
        before: {}
        after: {}
    ActionVerification:
      type: object
      additionalProperties: false
      required: [id, plan_id, verification_key, verifier_version, status, evidence_comparison, pre_snapshot, post_snapshot, missing_evidence, cooldown_seconds, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        plan_id: { type: string, format: uuid }
        verification_key: { type: string, maxLength: 64, description: SHA256 over (plan_id + verifier_version + evidence_hash) }
        verifier_version: { type: string, maxLength: 16 }
        status: { type: string, enum: [pending, effective, ineffective, failed, unknown], description: Missing evidence yields unknown, never effective }
        evidence_comparison: { type: string, enum: [improved, unchanged, worse, insufficient] }
        pre_snapshot: { $ref: '#/components/schemas/EvidenceSnapshot' }
        post_snapshot: { $ref: '#/components/schemas/EvidenceSnapshot' }
        slo_evaluation_before_id: { type: integer, format: int64 }
        slo_evaluation_after_id: { type: integer, format: int64 }
        missing_evidence: { type: boolean, description: True when pre or post evidence is unavailable; comparison must be insufficient }
        cooldown_seconds: { type: integer, minimum: 60 }
        verified_at: { type: string, format: date-time }
        reason: { type: string, description: Set when status is failed or unknown, or when rollback was escalated }
        rollback_triggered: { type: boolean, description: True when a failed/ineffective verification triggered the server-owned rollback contract }
        rollback_plan_id: { type: string, format: uuid, description: Set when a safe rollback plan was created; absent when rollback was unsafe and escalated to a human }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvidenceSnapshot:
      type: object
      additionalProperties: false
      required: [resource_state, captured_at, content_hash]
      properties:
        resource_state: { type: object, additionalProperties: true, description: Redacted target state (replicas, available_replicas, image, suspended, etc.) }
        slo_state: { $ref: '#/components/schemas/SLOSnapshot' }
        captured_at: { type: string, format: date-time }
        content_hash: { type: string, description: SHA-256 over the redacted JSON content for replayability }
    SLOSnapshot:
      type: object
      additionalProperties: false
      required: [slo_id, version, template, state, coverage, error_budget_ratio, burn_rate, evaluated_at]
      properties:
        slo_id: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
        template: { type: string, description: One of the 3 server-owned SLI templates }
        state: { type: string, enum: [healthy, burning_slow, burning_fast, breached, unavailable] }
        coverage: { type: string, enum: [complete, partial, insufficient] }
        error_budget_ratio: { type: number, minimum: 0 }
        burn_rate: { type: number, minimum: 0 }
        evaluated_at: { type: string, format: date-time }
    APIResource:
      type: object
      additionalProperties: false
      required: [version, resource, kind, namespaced, source]
      properties:
        group: { type: string, description: API group; empty for the core/v1 group }
        version: { type: string, description: API version (e.g. v1, v1beta1) }
        resource: { type: string, description: Plural resource name (e.g. pods, deployments) }
        kind: { type: string, description: Singular kind name (e.g. Pod, Deployment) }
        namespaced: { type: boolean, description: Whether the resource is namespace-scoped }
        source: { type: string, enum: [whitelist, discovery], description: 'whitelist = fixed operator-curated GVR (always present); discovery = dynamically discovered CRD or installed API resource' }
    APIResourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/APIResource' } }
    CustomResource:
      type: object
      description: A single redacted custom resource instance manifest. The shape mirrors the Kubernetes API response (apiVersion, kind, metadata, spec, status) but is returned as a free-form object because CRD schemas vary per GVR. Sensitive fields (password, secret, token, key, ...) are recursively redacted to "<redacted>".
      additionalProperties: true
    CustomResourceList:
      type: object
      additionalProperties: false
      required: [items, total, remaining]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomResource' } }
        total: { type: integer, minimum: 0, description: Total number of instances matching the query after authorization scoping }
        remaining: { type: integer, minimum: 0, description: Number of instances not returned in this page (total - offset - len(items)) }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, display_name, owner_user_id, metadata, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', description: DNS-subdomain name }
        display_name: { type: string, maxLength: 128 }
        owner_user_id: { type: integer, format: int64 }
        metadata: { type: object, additionalProperties: true, description: Arbitrary workspace metadata (JSON object) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, display_name]
      properties:
        name: { type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' }
        display_name: { type: string, maxLength: 128 }
        metadata: { type: object, additionalProperties: true }
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 128 }
        metadata: { type: object, additionalProperties: true }
    WorkspaceMembership:
      type: object
      additionalProperties: false
      required: [id, workspace_id, cluster_id, namespace, created_at]
      properties:
        id: { type: integer, format: int64 }
        workspace_id: { type: integer, format: int64 }
        cluster_id: { type: integer, format: int64 }
        namespace: { type: string, maxLength: 253 }
        created_at: { type: string, format: date-time }
    WorkspaceMembershipList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkspaceMembership' } }
    AddMembershipRequest:
      type: object
      additionalProperties: false
      required: [cluster_id, namespace]
      properties:
        cluster_id: { type: integer, format: int64, minimum: 1 }
        namespace: { type: string, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' }
    WorkspaceQuota:
      type: object
      additionalProperties: false
      required: [workspace_id, updated_at]
      properties:
        workspace_id: { type: integer, format: int64 }
        hard_cpu_cores: { type: number, format: float, minimum: 0, nullable: true }
        hard_memory_mib: { type: integer, format: int64, minimum: 0, nullable: true }
        hard_pod_count: { type: integer, format: int64, minimum: 0, nullable: true }
        hard_namespace_count: { type: integer, format: int64, minimum: 0, nullable: true }
        updated_at: { type: string, format: date-time }
    SetQuotaRequest:
      type: object
      additionalProperties: false
      properties:
        hard_cpu_cores: { type: number, format: float, minimum: 0, nullable: true }
        hard_memory_mib: { type: integer, format: int64, minimum: 0, nullable: true }
        hard_pod_count: { type: integer, format: int64, minimum: 0, nullable: true }
        hard_namespace_count: { type: integer, format: int64, minimum: 0, nullable: true }
    UserWorkspaceGrant:
      type: object
      additionalProperties: false
      required: [id, user_id, workspace_id, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        workspace_id: { type: integer, format: int64 }
        role: { type: string, enum: [workspace_admin, workspace_editor, workspace_viewer] }
        created_at: { type: string, format: date-time }
    UserWorkspaceGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserWorkspaceGrant' } }
    GrantRoleRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [workspace_admin, workspace_editor, workspace_viewer] }
    WorkspaceRoleBindingAudit:
      type: object
      additionalProperties: false
      required: [id, workspace_id, user_id, role, action, granted_at]
      properties:
        id: { type: integer, format: int64 }
        workspace_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        role: { type: string, description: Role at the time of the action; empty for revoked }
        action: { type: string, enum: [granted, revoked, changed] }
        granted_by: { type: integer, format: int64, nullable: true }
        granted_at: { type: string, format: date-time }
    WorkspaceRoleBindingAuditList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkspaceRoleBindingAudit' } }
    MonitoringPanel:
      type: object
      additionalProperties: false
      required: [title, metric, unit, resource_kind]
      properties:
        title: { type: string }
        metric: { type: string, enum: [cpu, memory] }
        unit: { type: string, enum: [nanocores, bytes] }
        resource_kind: { type: string, description: 'Node, Pod, etc.' }
        description: { type: string }
    ClusterDashboardResponse:
      type: object
      additionalProperties: false
      required: [template, cluster_id, from, to, panels]
      properties:
        template: { type: string, enum: [node_overview, workload_overview, pod_overview, workspace_overview] }
        cluster_id: { type: integer, format: int64 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        panels:
          type: array
          items: { $ref: '#/components/schemas/MonitoringPanel' }
    WorkspaceDashboardResponse:
      type: object
      additionalProperties: false
      required: [template, workspace_id, from, to, panels, clusters]
      properties:
        template: { type: string, enum: [workspace_overview] }
        workspace_id: { type: integer, format: int64 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        panels:
          type: array
          items: { $ref: '#/components/schemas/MonitoringPanel' }
        clusters:
          type: array
          description: Cross-cluster topology bounded by MaxClusters (20). Excess clusters are dropped.
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, namespaces]
            properties:
              cluster_id: { type: integer, format: int64 }
              namespaces:
                type: array
                items: { type: string }
    MonitoringLogQuery:
      type: object
      additionalProperties: false
      required: [namespace, start, end]
      properties:
        namespace: { type: string, maxLength: 253 }
        pod: { type: string, maxLength: 253 }
        container: { type: string, maxLength: 253 }
        text_filter: { type: string, maxLength: 256 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        direction: { type: string, enum: [forward, backward], default: forward }
        limit: { type: integer, minimum: 0, maximum: 500, default: 0, description: 'Maximum entries to return; 0 means provider default' }
    QualityReport:
      type: object
      additionalProperties: false
      required: [report_version, dataset_version_before, dataset_version_after, engine_versions_before, engine_versions_after, scenario_results, summary, generated_at]
      description: 'M56 golden dataset quality report. Compares a baseline replay (before) against a candidate replay (after) when rule, correlation, prompt, model, provider or evidence-schema changes occur. Generated offline; never self-modifies rules, prompts or policy online.'
      properties:
        report_version: { type: string, description: Quality report schema version }
        dataset_version_before: { type: string, description: Dataset version used for the baseline replay }
        dataset_version_after: { type: string, description: Dataset version used for the candidate replay }
        engine_versions_before: { $ref: '#/components/schemas/EngineVersions' }
        engine_versions_after: { $ref: '#/components/schemas/EngineVersions' }
        scenario_results:
          type: array
          items: { $ref: '#/components/schemas/ScenarioQuality' }
        summary: { $ref: '#/components/schemas/QualitySummary' }
        generated_at: { type: string, format: date-time }
        changed_components:
          type: array
          items: { type: string }
          description: Components that changed between before and after (e.g. correlation rule set, aiinvestigator prompt, automation gate evaluator). Empty means no component changed.
        reviewer: { type: string, description: Human reviewer; empty until reviewed }
        approved: { type: boolean, description: True when the report has been reviewed and approved }
    EngineVersions:
      type: object
      additionalProperties: false
      required: [signal_version, topology_version, slo_version, correlation_version, investigator_version, automation_version, verifier_version]
      description: Package-level version constants from each AIOps engine package, captured at replay time.
      properties:
        signal_version: { type: string, description: M39 signal schema version }
        topology_version: { type: string, description: M40 topology version }
        slo_version: { type: string, description: M41 SLO template version }
        correlation_version: { type: string, description: M42 correlation version }
        investigator_version: { type: string, description: M43 AI investigator version }
        automation_version: { type: string, description: M44 automation version }
        verifier_version: { type: string, description: M44 verifier version }
    ScenarioQuality:
      type: object
      additionalProperties: false
      required: [scenario_id, passed_before, passed_after, delta, steps_passed_before, steps_passed_after, steps_total]
      description: Compares one golden scenario's outcome before and after.
      properties:
        scenario_id: { type: string, enum: [mandatory_end_to_end, negative_misattribution, negative_partial_evidence], description: One of the 3 golden dataset scenarios }
        passed_before: { type: boolean, description: True when the scenario passed in the baseline }
        passed_after: { type: boolean, description: True when the scenario passed in the candidate }
        delta: { type: string, enum: [preserved, improved, regressed, unchanged], description: 'preserved = both pass; improved = fail to pass; regressed = pass to fail; unchanged = both fail' }
        steps_passed_before: { type: integer, minimum: 0 }
        steps_passed_after: { type: integer, minimum: 0 }
        steps_total: { type: integer, minimum: 0 }
        notes: { type: string, description: Human-readable note (e.g. regression reason) }
    QualitySummary:
      type: object
      additionalProperties: false
      required: [total_scenarios, passed_before, passed_after, improved, regressed, preserved, unchanged, total_steps_before, total_steps_after, total_steps]
      description: Aggregates the per-scenario quality results.
      properties:
        total_scenarios: { type: integer, minimum: 0 }
        passed_before: { type: integer, minimum: 0 }
        passed_after: { type: integer, minimum: 0 }
        improved: { type: integer, minimum: 0 }
        regressed: { type: integer, minimum: 0 }
        preserved: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        total_steps_before: { type: integer, minimum: 0 }
        total_steps_after: { type: integer, minimum: 0 }
        total_steps: { type: integer, minimum: 0 }
    QualityReplayResponse:
      type: object
      additionalProperties: false
      required: [task_id, status, message]
      description: Response for POST /quality-report/run. The replay executes asynchronously; poll GET /quality-report for the latest report.
      properties:
        task_id: { type: string, description: Async replay task ID (e.g. qr-<hex>) }
        status: { type: string, enum: [running, succeeded, failed] }
        message: { type: string, description: Human-readable status message }
    AICoverage:
      type: object
      additionalProperties: false
      description: M112-4 explanation coverage dashboard. Read-only, all-time aggregate over ai_explanations plus the aiexplain quality feedback baseline. availability = distinct diagnoses with at least one explanation.
      required: [total_explanations, explained_diagnoses, with_citations, citation_rate, deterministic_count, deterministic_rate, window_note]
      properties:
        total_explanations: { type: integer, minimum: 0, description: Explanations persisted in ai_explanations }
        explained_diagnoses: { type: integer, minimum: 0, description: Distinct diagnosis_id with at least one explanation (availability baseline) }
        with_citations: { type: integer, minimum: 0, description: Explanations carrying at least one citation }
        citation_rate: { type: number, minimum: 0, maximum: 1, description: with_citations / total_explanations }
        deterministic_count: { type: integer, minimum: 0, description: Explanations produced by the deterministic nop provider (degradation) }
        deterministic_rate: { type: number, minimum: 0, maximum: 1, description: deterministic_count / total_explanations }
        quality:
          type: object
          description: aiexplain quality feedback baseline.
          properties:
            total_feedback: { type: integer, minimum: 0 }
            helpful: { type: integer, minimum: 0 }
            partially_helpful: { type: integer, minimum: 0 }
            not_helpful: { type: integer, minimum: 0 }
            helpful_rate: { type: number, minimum: 0, maximum: 1 }
            explanations_with_feedback: { type: integer, minimum: 0 }
            contributors: { type: integer, minimum: 0 }
            by_model:
              type: array
              items:
                type: object
                properties:
                  model: { type: string }
                  total_feedback: { type: integer, minimum: 0 }
                  helpful: { type: integer, minimum: 0 }
                  partially_helpful: { type: integer, minimum: 0 }
                  not_helpful: { type: integer, minimum: 0 }
                  helpful_rate: { type: number, minimum: 0, maximum: 1 }
        window_note: { type: string }
    InsightRunbook:
      type: object
      additionalProperties: false
      required: [cluster_id, domain, kind, name, diagnoses, inspection, read_only]
      description: M81 closed-loop runbook resolving one posture finding to diagnosis, inspection, AI explanation and dry-run operation candidates.
      properties:
        cluster_id: { type: integer, format: int64 }
        domain: { type: string }
        finding_code: { type: string }
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        read_only: { type: boolean }
        diagnoses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [resource_kind, rule_ids, summary]
            properties:
              resource_kind: { type: string }
              rule_ids: { type: array, items: { type: string } }
              summary: { type: string }
        inspection:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rule_code, signal_code, summary]
            properties:
              rule_code: { type: string }
              signal_code: { type: string }
              summary: { type: string }
        ai_explanation:
          type: object
          additionalProperties: false
          required: [endpoint, summary]
          properties:
            endpoint: { type: string }
            summary: { type: string }
        operations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [action, target_kind, dry_run_first, summary]
            properties:
              action: { type: string }
              target_kind: { type: string }
              dry_run_first: { type: boolean }
              summary: { type: string }

        url_masked: { type: string, description: 'Masked HTTPS URL, e.g. https://***.example.com/webhook' }
        creator_id: { type: integer, format: int64 }
    AlertReceiverCreate:
      type: object
      additionalProperties: false
      required: [name, url, secret]

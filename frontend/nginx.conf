server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, content-addressed assets are immutable: cache them forever.
    # Filenames change when content changes, so a long TTL is safe and lets
    # repeat visits skip re-downloads entirely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The HTML shell must NEVER be served from a stale cache. Without this,
        # browsers heuristic-cache index.html and keep loading an old hashed
        # bundle after a redeploy — which resurrects "fixed" frontend bugs
        # (e.g. the sidebar-not-navigating-after-login regression).
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
